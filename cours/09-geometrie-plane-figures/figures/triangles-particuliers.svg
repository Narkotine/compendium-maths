<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 246" width="750" height="246" font-family="Arial, Helvetica, sans-serif">
<title>Triangle isocèle (angles à la base égaux), équilatéral (trois angles de 60°), rectangle (angles aigus complémentaires)</title>
<rect width="750" height="246" fill="white"/>
<polygon points="110,40 30,170 190,170" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="76" y1="108.7" x2="64" y2="101.3" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="156" y1="101.3" x2="144" y2="108.7" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<path d="M56,170 A26,26 0 0 0 43.6,147.9" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<path d="M176.4,147.9 A26,26 0 0 0 164,170" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="110" y="30" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="20" y="186" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="200" y="186" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="110" y="210" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Isocèle en A : AB = AC,</text>
<text x="110" y="228.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">les angles à la base sont égaux.</text>
<polygon points="350,31.4 270,170 430,170" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="317.3" y1="102.1" x2="305.2" y2="95.1" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="314.8" y1="106.4" x2="302.7" y2="99.4" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="394.8" y1="95.1" x2="382.7" y2="102.1" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="397.3" y1="99.4" x2="385.2" y2="106.4" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="347.5" y1="163" x2="347.5" y2="177" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="352.5" y1="163" x2="352.5" y2="177" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<path d="M294,170 A24,24 0 0 0 282,149.2" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="306.4" y="154" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text>
<path d="M418,149.2 A24,24 0 0 0 406,170" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="393.6" y="154" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text>
<path d="M338,52.2 A24,24 0 0 0 362,52.2" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="350" y="78.4" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text>
<text x="350" y="210" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Équilatéral : trois côtés égaux,</text>
<text x="350" y="228.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">trois angles de 60°.</text>
<polygon points="520,50 520,170 700,170" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="534,170 534,156 520,156" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M666.7,147.8 A40,40 0 0 0 660,170" fill="none" stroke="#1f4e79" stroke-width="1.8"/>
<text x="644.5" y="158.2" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">34°</text>
<path d="M520,76 A26,26 0 0 0 541.6,64.4" fill="none" stroke="#2e7d32" stroke-width="1.8"/>
<text x="540.8" y="93.8" font-size="13.7" fill="#2e7d32" text-anchor="middle" font-weight="bold">56°</text>
<text x="508" y="54" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="508" y="186" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="710" y="186" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="610" y="210" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Rectangle en B : les angles aigus</text>
<text x="610" y="228.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">sont complémentaires (34° + 56° = 90°).</text>
</svg>
