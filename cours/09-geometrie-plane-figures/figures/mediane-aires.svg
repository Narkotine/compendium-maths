<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" width="740" height="330" font-family="Arial, Helvetica, sans-serif">
<title>La médiane [AM] partage le triangle ABC en deux triangles ABM et AMC de même aire : bases BM et MC égales, même hauteur AH</title>
<rect x="0" y="0" width="740" height="330" fill="white"/>
<polygon points="170.0,45.0 50.0,245.0 250.0,245.0" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="170.0,45.0 250.0,245.0 450.0,245.0" fill="#f6dcd8" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="170.0" y1="45.0" x2="170.0" y2="245.0" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 4"/>
<polyline points="170.0,234.0 181.0,234.0 181.0,245.0" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<line x1="170.0" y1="45.0" x2="250.0" y2="245.0" stroke="#1f4e79" stroke-width="3" stroke-linecap="round"/>
<line x1="150.0" y1="238.0" x2="150.0" y2="252.0" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="350.0" y1="238.0" x2="350.0" y2="252.0" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<text x="170.0" y="33.0" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="34.0" y="253.0" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="466.0" y="253.0" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="250.0" y="275.0" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">M</text>
<text x="170.0" y="275.0" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<circle cx="250.0" cy="245.0" r="4" fill="#1f4e79"/>
<text x="605.0" y="95.0" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">BM = MC (M milieu de [BC])</text>
<text x="605.0" y="130.0" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">même hauteur AH</text>
<text x="605.0" y="175.0" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">aire(ABM) = BM × AH ÷ 2</text>
<text x="605.0" y="205.0" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">aire(AMC) = MC × AH ÷ 2</text>
<text x="605.0" y="245.0" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold">donc les deux aires sont égales</text>
<text x="370.0" y="310.0" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">La médiane issue de A partage le triangle en deux triangles de même aire.</text>
</svg>
