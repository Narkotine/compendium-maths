<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="Arial, Helvetica, sans-serif">
<title>Deux droites sécantes, deux droites perpendiculaires, deux droites parallèles</title>
<rect width="720" height="250" fill="white"/>
<line x1="26" y1="149.2" x2="214" y2="80.8" stroke="#1f4e79" stroke-width="2.4" stroke-linecap="round"/>
<line x1="160.1" y1="201.1" x2="79.9" y2="28.9" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="120" cy="115" r="3.5" fill="#222" stroke="#222" stroke-width="1"/>
<text x="124.7" y="102.6" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">I</text>
<text x="210" y="72.8" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">(d)</text>
<text x="93.9" y="32.9" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">(d′)</text>
<text x="120" y="215" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Sécantes :</text>
<text x="120" y="233.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">un seul point commun I.</text>
<line x1="258.4" y1="140.9" x2="451.6" y2="89.1" stroke="#1f4e79" stroke-width="2.4" stroke-linecap="round"/>
<line x1="378.3" y1="201.9" x2="331.7" y2="28.1" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polyline points="367.6,111.6 364.2,99.1 351.6,102.4" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="447.6" y="81.1" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">(d)</text>
<text x="349.7" y="34.1" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">(d′)</text>
<text x="355" y="215" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Perpendiculaires :</text>
<text x="355" y="233.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">sécantes en angle droit, (d) ⊥ (d′).</text>
<line x1="490" y1="85" x2="680" y2="55" stroke="#1f4e79" stroke-width="2.4" stroke-linecap="round"/>
<line x1="490" y1="155" x2="680" y2="125" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
<polyline points="582.9,74.6 589.1,69.3 581.6,66.3" fill="none" stroke="#1f4e79" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="582.9,144.6 589.1,139.3 581.6,136.3" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="690" y="59" font-size="14.7" fill="#1f4e79" text-anchor="start" font-weight="bold">(d)</text>
<text x="690" y="129" font-size="14.7" fill="#c0392b" text-anchor="start" font-weight="bold">(d′)</text>
<text x="590" y="215" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Parallèles :</text>
<text x="590" y="233.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">aucun point commun, (d) // (d′).</text>
</svg>
