<circle cx="560" cy="205" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<line x1="497.5" y1="198" x2="497.5" y2="212" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="502.5" y1="198" x2="502.5" y2="212" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="617.5" y1="198" x2="617.5" y2="212" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="622.5" y1="198" x2="622.5" y2="212" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="560" y1="205" x2="491.2" y2="106.7" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="560" y="225" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">O</text>
<text x="485.2" y="94.7" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="426" y="211" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="694" y="211" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="560" y="350" font-size="19.5" fill="#222" text-anchor="middle" font-weight="bold">Triangle rectangle en A : le centre est</text>
<text x="560" y="377" font-size="19.5" fill="#222" text-anchor="middle" font-weight="normal">le milieu O de l’hypoténuse [BC].</text>
