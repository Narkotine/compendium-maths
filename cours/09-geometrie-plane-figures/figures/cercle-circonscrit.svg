<svg xmlns="http://www.w3.org/2000/svg" viewBox="-17 0 757 390" width="757" height="390" font-family="Arial, Helvetica, sans-serif">
<title>Les médiatrices d’un triangle se coupent au centre du cercle circonscrit ; pour un triangle rectangle, ce centre est le milieu de l’hypoténuse</title>
<rect x="-17" y="0" width="757" height="390" fill="white"/>
<circle cx="178.6" cy="181.4" r="124.7" fill="none" stroke="#1f4e79" stroke-width="2"/>
<polygon points="150,60 60,220 300,210" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="74.5" y1="122.8" x2="209.1" y2="198.6" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 4"/>
<polyline points="100.6,147.8 108.4,152.3 112.8,144.4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<line x1="181.5" y1="250" x2="177.1" y2="146.4" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 4"/>
<polyline points="189,214.6 188.6,205.6 179.6,206" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<line x1="249.7" y1="110.3" x2="153.9" y2="206.1" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 4"/>
<polyline points="218.6,128.6 212.3,135 218.6,141.4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="178.6" cy="181.4" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<text x="197.9" y="181.2" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">O</text>
<text x="150" y="48" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="46" y="228" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="314" y="218" font-size="22.5" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="180" y="350" font-size="19.5" fill="#222" text-anchor="middle" font-weight="bold">Les trois médiatrices se coupent en O,</text>
<text x="180" y="377" font-size="19.5" fill="#222" text-anchor="middle" font-weight="normal">centre du cercle circonscrit (OA = OB = OC).</text>
<circle cx="560" cy="205" r="120" fill="none" stroke="#1f4e79" stroke-width="2"/>
<polygon points="491.2,106.7 440,205 680,205" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
