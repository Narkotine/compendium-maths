<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 776 220" width="776" height="220" font-family="Arial, Helvetica, sans-serif">
<title>Angles adjacents, complémentaires (somme 90°), supplémentaires (somme 180°), opposés par le sommet (égaux)</title>
<rect x="-6" y="0" width="776" height="220" fill="white"/>
<line x1="40" y1="140" x2="180" y2="140" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="40" y1="140" x2="139.6" y2="56.4" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="40" y1="140" x2="29.5" y2="20.5" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="40" cy="140" r="3" fill="#222" stroke="#222" stroke-width="1"/>
<path d="M74,140 A34,34 0 0 0 66,118.1" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="88.9" y="127.2" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">40°</text>
<path d="M59.9,123.3 A26,26 0 0 0 37.7,114.1" fill="none" stroke="#1f4e79" stroke-width="1.8"/>
<text x="56.8" y="104.3" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">55°</text>
<text x="115" y="190" font-size="15.6" fill="#222" text-anchor="middle" font-weight="bold">Adjacents :</text>
<text x="115" y="211.6" font-size="15.6" fill="#222" text-anchor="middle" font-weight="normal">même sommet, un côté commun.</text>
<line x1="245" y1="140" x2="375" y2="140" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="245" y1="140" x2="351.5" y2="65.4" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="245" y1="140" x2="245" y2="20" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<polyline points="257,140 257,128 245,128" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M285,140 A40,40 0 0 0 277.8,117.1" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="300.3" y="127.6" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">35°</text>
<path d="M269.6,122.8 A30,30 0 0 0 245,110" fill="none" stroke="#1f4e79" stroke-width="1.8"/>
<text x="267.2" y="102.4" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">55°</text>
<text x="305" y="190" font-size="15.6" fill="#222" text-anchor="middle" font-weight="bold">Complémentaires :</text>
<text x="305" y="211.6" font-size="15.6" fill="#222" text-anchor="middle" font-weight="normal">35° + 55° = 90°.</text>
<line x1="405" y1="140" x2="585" y2="140" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="495" y1="140" x2="559.3" y2="63.4" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<path d="M525,140 A30,30 0 0 0 514.3,117" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="538.5" y="124.7" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">50°</text>
<path d="M509.1,123.1 A22,22 0 0 0 473,140" fill="none" stroke="#1f4e79" stroke-width="1.8"/>
<text x="476.4" y="105.1" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">130°</text>
<text x="495" y="190" font-size="15.6" fill="#222" text-anchor="middle" font-weight="bold">Supplémentaires :</text>
<text x="495" y="211.6" font-size="15.6" fill="#222" text-anchor="middle" font-weight="normal">130° + 50° = 180°.</text>
<line x1="735.6" y1="60" x2="614.4" y2="130" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="614.4" y1="60" x2="735.6" y2="130" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<path d="M697.5,108 A26,26 0 0 0 697.5,82" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="717" y="100" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text>
<path d="M652.5,82 A26,26 0 0 0 652.5,108" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="633" y="100" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text>
<text x="675" y="190" font-size="15.6" fill="#222" text-anchor="middle" font-weight="bold">Opposés par le sommet :</text>
<text x="675" y="211.6" font-size="15.6" fill="#222" text-anchor="middle" font-weight="normal">ils sont égaux.</text>
</svg>
