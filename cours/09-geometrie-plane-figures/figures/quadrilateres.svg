<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 784 530" width="784" height="530" font-family="Arial, Helvetica, sans-serif">
<title>La famille des parallélogrammes : rectangle (angle droit), losange (côtés consécutifs égaux), carré (les deux) ; propriétés des côtés et des diagonales</title>
<rect x="-10" y="0" width="784" height="530" fill="white"/>
<polygon points="290,100 420,100 455,40 325,40" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="290" y1="100" x2="455" y2="40" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="420" y1="100" x2="325" y2="40" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="352.2,104.2 359.2,100 352.2,95.8" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="387.2,44.2 394.2,40 387.2,35.8" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="308.2,77.1 308.1,69 300.9,72.9" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="311.2,71.9 311.1,63.8 304,67.7" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="438.2,77.1 438.1,69 430.9,72.9" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<polyline points="441.2,71.9 441.1,63.8 434,67.7" fill="none" stroke="#222" stroke-width="1.8" stroke-linejoin="round"/>
<text x="370" y="128" font-size="16.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">Parallélogramme</text>
<text x="370" y="146" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">côtés opposés parallèles et de même longueur ;</text>
<text x="370" y="164.4" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">diagonales qui se coupent en leur milieu.</text>
<polygon points="80,290 220,290 220,230 80,230" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="80" y1="290" x2="220" y2="230" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="220" y1="290" x2="80" y2="230" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="90,290 90,280 80,280" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="150" y="316" font-size="16.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">Rectangle</text>
<text x="150" y="334" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">quatre angles droits ;</text>
<text x="150" y="352.4" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">diagonales de même longueur.</text>
<polygon points="590,300 650,260 590,220 530,260" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="590" y1="300" x2="590" y2="220" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="650" y1="260" x2="530" y2="260" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="616.1" y1="274.2" x2="623.9" y2="285.8" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="616.1" y1="245.8" x2="623.9" y2="234.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="563.9" y1="245.8" x2="556.1" y2="234.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="563.9" y1="274.2" x2="556.1" y2="285.8" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polyline points="598,260 598,252 590,252" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="590" y="326" font-size="16.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">Losange</text>
<text x="590" y="344" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">quatre côtés de même longueur ;</text>
<text x="590" y="362.4" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">diagonales perpendiculaires.</text>
<polygon points="330,470 410,470 410,390 330,390" fill="#dbe8f5" stroke="#222" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="330" y1="470" x2="410" y2="390" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="410" y1="470" x2="330" y2="390" stroke="#666" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="339,470 339,461 330,461" fill="none" stroke="#222" stroke-width="1.5"/>
<line x1="370" y1="463" x2="370" y2="477" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="403" y1="430" x2="417" y2="430" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="370" y1="397" x2="370" y2="383" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<line x1="337" y1="430" x2="323" y2="430" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<text x="370" y="496" font-size="16.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">Carré</text>
<text x="370" y="514" font-size="13.8" fill="#222" text-anchor="middle" font-weight="normal">à la fois rectangle et losange.</text>
<line x1="300" y1="172" x2="188.3" y2="218.5" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="180,222 186.8,214.8 189.9,222.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<line x1="440" y1="172" x2="551.5" y2="209.2" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="560,212 550.2,213 552.7,205.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<line x1="190" y1="360" x2="311.3" y2="392.7" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="320,395 310.3,396.6 312.4,388.7" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<line x1="550" y1="370" x2="428.8" y2="393.3" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="420,395 428.1,389.3 429.6,397.3" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="200" y="172" font-size="13.8" fill="#c0392b" text-anchor="end" font-weight="bold">+ un angle droit</text>
<text x="200" y="190.4" font-size="13.8" fill="#c0392b" text-anchor="end" font-weight="normal">ou diagonales de même longueur</text>
<text x="560" y="170" font-size="13.8" fill="#c0392b" text-anchor="start" font-weight="bold">+ deux côtés consécutifs égaux</text>
<text x="560" y="188.4" font-size="13.8" fill="#c0392b" text-anchor="start" font-weight="normal">ou diagonales perpendiculaires</text>
<text x="210" y="392" font-size="13.8" fill="#c0392b" text-anchor="end" font-weight="bold">+ losange</text>
<text x="520" y="392" font-size="13.8" fill="#c0392b" text-anchor="start" font-weight="bold">+ rectangle</text>
</svg>
