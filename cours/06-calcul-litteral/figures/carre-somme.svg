<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" font-family="Arial, Helvetica, sans-serif">
<title>Carré de côté a + b découpé en un carré a², un carré b² et deux rectangles ab : (a + b)² = a² + 2ab + b²</title>
<rect width="660" height="290" fill="white"/>
<rect x="60" y="40" width="156" height="156" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/>
<text x="138" y="125" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">a²</text>
<rect x="216" y="40" width="78" height="156" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2"/>
<text x="255" y="125" font-size="18.9" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-style="italic">ab</text>
<rect x="60" y="196" width="156" height="78" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2"/>
<text x="138" y="242" font-size="18.9" fill="#2e7d32" text-anchor="middle" font-weight="bold" font-style="italic">ab</text>
<rect x="216" y="196" width="78" height="78" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/>
<text x="255" y="242" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold" font-style="italic">b²</text>
<text x="138" y="30" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">a</text>
<text x="255" y="30" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">b</text>
<text x="48" y="124" font-size="16.8" fill="#222" text-anchor="end" font-weight="bold" font-style="italic">a</text>
<text x="48" y="241" font-size="16.8" fill="#222" text-anchor="end" font-weight="bold" font-style="italic">b</text>
<text x="330" y="90" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Carré de côté a + b :</text>
<text x="330" y="120" font-size="17.9" fill="#222" text-anchor="start" font-weight="bold">(a + b)² = a² + 2ab + b²</text>
<text x="330" y="152" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="normal">Les deux rectangles verts ab</text>
<text x="330" y="170.9" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="normal">donnent le « double produit » 2ab.</text>
<text x="330" y="208" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="bold">Sans eux : a² + b² est trop petit !</text>
</svg>
