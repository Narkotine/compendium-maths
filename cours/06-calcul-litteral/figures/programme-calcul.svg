<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="680" height="306" font-family="Arial, Helvetica, sans-serif">
<title>Programme de calcul : choisir un nombre, ajouter 3, élever au carré, soustraire le carré du nombre de départ ; avec 2 on obtient 21 ; avec x on obtient (x + 3)² − x² = 6x + 9</title>
<rect width="680" height="306" fill="white"/>
<text x="30" y="30" font-size="14.7" fill="#222" text-anchor="start" font-weight="bold">Programme</text>
<text x="370" y="30" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">avec 2</text>
<text x="560" y="30" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">avec x</text>
<rect x="20" y="46" width="280" height="36" rx="6" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
<text x="160" y="69" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Choisir un nombre</text>
<rect x="310" y="46" width="120" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/>
<text x="370" y="69" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">2</text>
<rect x="470" y="46" width="180" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="69" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">x</text>
<line x1="160" y1="84" x2="160" y2="93" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="160,100 156.8,93 163.2,93" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="370" y1="84" x2="370" y2="93" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="370,100 366.9,93 373.1,93" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="560" y1="84" x2="560" y2="93" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="560,100 556.9,93 563.1,93" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="20" y="102" width="280" height="36" rx="6" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
<text x="160" y="125" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Ajouter 3</text>
<rect x="310" y="102" width="120" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/>
<text x="370" y="125" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">5</text>
<rect x="470" y="102" width="180" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="125" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">x + 3</text>
<line x1="160" y1="140" x2="160" y2="149" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="160,156 156.8,149 163.2,149" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="370" y1="140" x2="370" y2="149" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="370,156 366.9,149 373.1,149" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="560" y1="140" x2="560" y2="149" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="560,156 556.9,149 563.1,149" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="20" y="158" width="280" height="36" rx="6" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
<text x="160" y="181" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Élever au carré</text>
<rect x="310" y="158" width="120" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/>
<text x="370" y="181" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">25</text>
<rect x="470" y="158" width="180" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="181" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">(x + 3)²</text>
<line x1="160" y1="196" x2="160" y2="205" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="160,212 156.8,205 163.2,205" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="370" y1="196" x2="370" y2="205" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="370,212 366.9,205 373.1,205" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="560" y1="196" x2="560" y2="205" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="560,212 556.9,205 563.1,205" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="20" y="214" width="280" height="36" rx="6" fill="#eeeeee" stroke="#222" stroke-width="1.5"/>
<text x="160" y="237" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Soustraire le carré du nombre de départ</text>
<rect x="310" y="214" width="120" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/>
<text x="370" y="237" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">25 − 4 = 21</text>
<rect x="470" y="214" width="180" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/>
<text x="560" y="237" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">(x + 3)² − x²</text>
<text x="30" y="290" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Développer : (x + 3)² − x² = x² + 6x + 9 − x² = 6x + 9. Contrôle avec x = 2 : 6 × 2 + 9 = 21.</text>
</svg>
