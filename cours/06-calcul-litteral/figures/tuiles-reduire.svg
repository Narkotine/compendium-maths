<text x="129" y="210" font-size="15.4" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">x</text>
<text x="104" y="211" font-size="22" fill="#222" text-anchor="middle" font-weight="normal">+</text>
<text x="165" y="200" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">x² + x : deux sortes de tuiles différentes,</text>
<text x="165" y="222" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">on ne peut pas les regrouper (x² + x ≠ 2x², ≠ x³).</text>
<text x="20" y="280" font-size="13.2" fill="#666" text-anchor="start" font-weight="normal">tuile x : longueur x ; tuile 1 : un carré unité ; tuile x² : carré de côté x</text>
