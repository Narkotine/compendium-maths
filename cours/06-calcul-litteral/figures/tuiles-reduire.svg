<text x="569" y="104" font-size="13.2" fill="#c0392b" text-anchor="middle" font-weight="normal">1</text>
<text x="358" y="136" font-size="16.5" fill="#2e7d32" text-anchor="start" font-weight="bold">5x + 3</text>
<rect x="20" y="170" width="70" height="70" rx="0" fill="#eeeeee" stroke="#1f4e79" stroke-width="1.6"/>
<text x="55" y="210" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">x²</text>
