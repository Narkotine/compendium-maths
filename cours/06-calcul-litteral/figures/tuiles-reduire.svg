<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 294" width="680" height="294" font-family="Arial, Helvetica, sans-serif">
<title>Tuiles algébriques : 3x + 2 plus 2x + 1 donne 5x + 3 en regroupant les tuiles x et les tuiles unités ; une tuile x² et une tuile x ne se regroupent pas</title>
