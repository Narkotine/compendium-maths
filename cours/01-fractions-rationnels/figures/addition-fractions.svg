<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="Arial, Helvetica, sans-serif">
<title>Addition de fractions : 1/6 et 3/4 sont recoupés en douzièmes, 2/12 et 9/12 ; mis bout à bout ils font 11/12 de l’unité</title>
<rect width="720" height="262" fill="white"/>
<text x="30" y="26" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">1/6 + 3/4 : on recoupe tout en douzièmes (12 est un multiple de 6 et de 4).</text>
<rect x="120" y="44" width="80" height="34" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/>
<rect x="200" y="44" width="80" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="280" y="44" width="80" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="360" y="44" width="80" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="440" y="44" width="80" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="520" y="44" width="80" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="120" y="44" width="480" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="70" y="60" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">1</text>
<line x1="62.4" y1="65" x2="77.7" y2="65" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/>
<text x="70" y="81" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">6</text>
<rect x="120" y="94" width="120" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="240" y="94" width="120" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="360" y="94" width="120" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="480" y="94" width="120" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="120" y="94" width="480" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="70" y="110" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text>
<line x1="62.4" y1="115" x2="77.7" y2="115" stroke="#1f4e79" stroke-width="1.6" stroke-linecap="round"/>
<text x="70" y="131" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">4</text>
<rect x="120" y="164" width="40" height="34" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/>
<rect x="160" y="164" width="40" height="34" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/>
<rect x="200" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="240" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="280" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="320" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="360" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="400" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="440" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="480" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="520" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="560" y="164" width="40" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="120" y="164" width="480" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<rect x="200" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="240" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="280" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="320" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="360" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="400" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="440" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="480" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="520" y="164" width="40" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="120" y="164" width="480" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="160" y="216" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="bold">2/12</text>
<text x="380" y="216" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="bold">9/12</text>
<text x="30" y="186" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">Somme</text>
<text x="614" y="186" font-size="18.7" fill="#222" text-anchor="start" font-weight="bold">11/12</text>
<text x="30" y="248" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">1/6 = 2/12 et 3/4 = 9/12, donc 1/6 + 3/4 = 2/12 + 9/12 = 11/12 : on ajoute des parts de même taille.</text>
</svg>
