<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" font-family="Arial, Helvetica, sans-serif">
<title>En haut : 40 euros partagés en 5 parts de 8 euros, 3 parts coloriées : 3/5 de 40 = 24 ; en bas : 3 unités découpées en quarts, soit 12 quarts : 3 divisé par 1/4 = 12</title>
<rect width="720" height="284" fill="white"/>
<text x="30" y="26" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">3/5 de 40 € : on partage 40 € en 5 parts égales, on en prend 3.</text>
<rect x="60" y="42" width="100" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="160" y="42" width="100" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="260" y="42" width="100" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/>
<rect x="360" y="42" width="100" height="40" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="460" y="42" width="100" height="40" rx="0" fill="white" stroke="#666" stroke-width="1.3"/>
<rect x="60" y="42" width="500" height="40" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="110" y="68" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">8 €</text>
<text x="210" y="68" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">8 €</text>
<text x="310" y="68" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">8 €</text>
<text x="410" y="68" font-size="16.5" fill="#666" text-anchor="middle" font-weight="bold">8 €</text>
<text x="510" y="68" font-size="16.5" fill="#666" text-anchor="middle" font-weight="bold">8 €</text>
<line x1="60" y1="96" x2="560" y2="96" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="90" x2="60" y2="102" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<line x1="560" y1="90" x2="560" y2="102" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
<text x="310" y="116" font-size="15.4" fill="#222" text-anchor="middle" font-weight="bold">40 €</text>
<text x="580" y="60" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">40 ÷ 5 = 8</text>
<text x="580" y="82" font-size="16.5" fill="#1f4e79" text-anchor="start" font-weight="bold">3 × 8 = 24 €</text>
<text x="30" y="160" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">3 ÷ 1/4 : combien de quarts dans 3 unités ?</text>
<rect x="60" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="100" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="140" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="180" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="60" y="176" width="160" height="40" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="140" y="236" font-size="13.2" fill="#666" text-anchor="middle" font-weight="normal">unité 1</text>
<rect x="230" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="270" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="310" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="350" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="230" y="176" width="160" height="40" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="310" y="236" font-size="13.2" fill="#666" text-anchor="middle" font-weight="normal">unité 2</text>
<rect x="400" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="440" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="480" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="520" y="176" width="40" height="40" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/>
<rect x="400" y="176" width="160" height="40" rx="0" fill="none" stroke="#222" stroke-width="2"/>
<text x="480" y="236" font-size="13.2" fill="#666" text-anchor="middle" font-weight="normal">unité 3</text>
<text x="580" y="194" font-size="16.5" fill="#2e7d32" text-anchor="start" font-weight="bold">3 × 4 = 12 quarts</text>
<text x="580" y="216" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">3 ÷ 1/4 = 3 × 4 = 12</text>
<text x="30" y="268" font-size="15.4" fill="#222" text-anchor="start" font-weight="bold">Diviser par 1/4, c’est multiplier par 4 (l’inverse de 1/4).</text>
</svg>
