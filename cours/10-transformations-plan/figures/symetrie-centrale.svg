<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 285" width="700" height="285" font-family="Arial, Helvetica, sans-serif">
<title>Symétrie centrale de centre O : O est le milieu de [MM′] ; l’image d’un triangle est le triangle tourné d’un demi-tour, ses côtés sont parallèles à ceux de départ</title>
<rect width="700" height="285" fill="white"/>
<line x1="60" y1="80" x2="260" y2="180" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="112.7" y1="99.6" x2="107.3" y2="110.4" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<line x1="212.7" y1="149.6" x2="207.3" y2="160.4" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="60" cy="80" r="3.5" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/>
<circle cx="260" cy="180" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="160" cy="130" r="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
<text x="56" y="68" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">M</text>
<text x="264" y="202" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">M′</text>
<text x="162" y="118" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">O</text>
<text x="160" y="250" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">O est le milieu de [MM′].</text>
<polygon points="400,60 360,150 450,120" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="600,200 640,110 550,140" fill="#fdebd0" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="400" y1="60" x2="600" y2="200" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="390" y="52" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">A</text>
<text x="610" y="220" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">A′</text>
<line x1="360" y1="150" x2="640" y2="110" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="346" y="142" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text>
<text x="654" y="130" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">B′</text>
<line x1="450" y1="120" x2="550" y2="140" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="448" y="112" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">C</text>
<text x="552" y="160" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">C′</text>
<circle cx="500" cy="130" r="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/>
<text x="504" y="120" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">O</text>
<text x="500" y="250" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">A′B′C′ est ABC « tourné d’un demi-tour » autour de O ;</text>
<text x="500" y="268" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">(A′B′) est parallèle à (AB).</text>
</svg>
