<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 700 306" width="700" height="306" font-family="Arial, Helvetica, sans-serif">
<title>Symétrie axiale : la droite (d) est la médiatrice de [MM′] ; image d’un triangle ABC, retournée</title>
<rect x="0" y="-6" width="700" height="306" fill="white"/>
<line x1="60" y1="230" x2="250" y2="30" stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round"/>
<text x="258" y="38" font-size="14.7" fill="#2e7d32" text-anchor="start" font-weight="bold">(d)</text>
<line x1="95" y1="75" x2="213" y2="187.1" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4"/>
<polyline points="161.6,123.1 153.6,115.5 146,123.5" fill="none" stroke="#222" stroke-width="1.5"/>
<line x1="126.8" y1="97" x2="118.6" y2="105.7" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<line x1="130.4" y1="100.4" x2="122.2" y2="109.1" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<line x1="185.8" y1="153" x2="177.6" y2="161.7" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<line x1="189.4" y1="156.4" x2="181.2" y2="165.1" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="95" cy="75" r="3.5" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/>
<circle cx="213" cy="187.1" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="154" cy="131.1" r="3" fill="#222" stroke="#222" stroke-width="1"/>
<text x="83" y="69" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">M</text>
<text x="227" y="193.1" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">M′</text>
<text x="140" y="147.1" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<text x="160" y="262" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">(d) est la médiatrice de [MM′] :</text>
<text x="160" y="280.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">perpendiculaire en son milieu H.</text>
<line x1="520" y1="20" x2="520" y2="240" stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round"/>
<text x="528" y="30" font-size="14.7" fill="#2e7d32" text-anchor="start" font-weight="bold">(d)</text>
<polygon points="420,60 380,190 480,150" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.2" stroke-linejoin="round"/>
<polygon points="620,60 660,190 560,150" fill="#fdebd0" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="420" y1="60" x2="620" y2="60" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="406" y="65" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">A</text>
<text x="635" y="65" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">A′</text>
<line x1="380" y1="190" x2="660" y2="190" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="366" y="195" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text>
<text x="675" y="195" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">B′</text>
<line x1="480" y1="150" x2="560" y2="150" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="466" y="155" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">C</text>
<text x="575" y="155" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">C′</text>
<text x="570" y="130" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="520" y="262" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">L’image d’un triangle : on construit</text>
<text x="520" y="280.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">l’image de chaque sommet. A′B′C′ est « retourné ».</text>
