<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, Helvetica, sans-serif">
<title>Relation de Chasles : vecteur AB + vecteur BC = vecteur AC ; règle du parallélogramme : vecteur AB + vecteur AD = vecteur AC</title>
<rect x="0" y="0" width="760" height="330" fill="white"/>
<line x1="50.0" y1="240.0" x2="222.0" y2="96.7" stroke="#1f4e79" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="230.0,90.0 216.3,93.8 223.8,102.8" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<line x1="230.0" y1="90.0" x2="324.0" y2="221.5" stroke="#1f4e79" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="330.0,230.0 327.2,216.0 317.7,222.8" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<line x1="50.0" y1="240.0" x2="319.6" y2="230.4" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
