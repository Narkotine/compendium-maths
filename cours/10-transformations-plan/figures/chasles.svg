<circle cx="50.0" cy="240.0" r="4" fill="#222"/>
<text x="36.0" y="250.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<circle cx="230.0" cy="90.0" r="4" fill="#222"/>
<text x="230.0" y="76.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<circle cx="330.0" cy="230.0" r="4" fill="#222"/>
<text x="346.0" y="238.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="190.0" y="295.0" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">vecteur AB + vecteur BC = vecteur AC</text>
<text x="190.0" y="320.0" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">(les flèches mises bout à bout)</text>
<polygon points="430,240 620,240 690,110 500,110" fill="#eef3f9" stroke="#222" stroke-width="1.4" stroke-dasharray="6 4"/>
<line x1="430.0" y1="240.0" x2="609.6" y2="240.0" stroke="#1f4e79" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="620.0,240.0 607.0,234.2 607.0,245.8" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<line x1="430.0" y1="240.0" x2="495.1" y2="119.2" stroke="#1f4e79" stroke-width="2.6" stroke-linecap="round"/>
<polygon points="500.0,110.0 488.7,118.7 499.0,124.2" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<line x1="430.0" y1="240.0" x2="680.7" y2="114.7" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<polygon points="690.0,110.0 675.8,110.6 681.0,121.0" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<circle cx="430.0" cy="240.0" r="4" fill="#222"/>
<text x="416.0" y="250.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<circle cx="620.0" cy="240.0" r="4" fill="#222"/>
<text x="634.0" y="250.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<circle cx="690.0" cy="110.0" r="4" fill="#222"/>
<text x="704.0" y="104.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<circle cx="500.0" cy="110.0" r="4" fill="#222"/>
<text x="486.0" y="104.0" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">D</text>
<text x="570.0" y="295.0" font-size="16.5" fill="#222" text-anchor="middle" font-weight="normal">ABCD parallélogramme :</text>
<text x="570.0" y="320.0" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">vecteur AB + vecteur AD = vecteur AC</text>
