<text x="258" y="208" font-size="13" fill="#666" text-anchor="start" font-weight="normal">H(5 ; 2)</text>
<text x="186" y="210" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="normal">5 − 1 = 4</text>
<text x="260" y="134" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="normal">5 − 2 = 3</text>
<text x="330" y="312" font-size="16.1" fill="#c0392b" text-anchor="middle" font-weight="bold">AB² = 4² + 3² = 25, donc AB = 5 (unités du repère).</text>
