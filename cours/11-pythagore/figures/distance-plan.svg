<text x="40" y="288" font-size="13.8" fill="#666" text-anchor="end" font-weight="normal">0</text>
<polygon points="90,190 250,190 250,70" fill="#fdebd0" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="90" y1="190" x2="250" y2="190" stroke="#1f4e79" stroke-width="2.5"/>
<line x1="250" y1="190" x2="250" y2="70" stroke="#1f4e79" stroke-width="2.5"/>
