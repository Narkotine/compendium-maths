<text x="130" y="288" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">2</text>
<text x="170" y="288" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">3</text>
<text x="210" y="288" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">4</text>
<text x="250" y="288" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">5</text>
<text x="290" y="288" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">6</text>
<text x="40" y="234" font-size="13.8" fill="#666" text-anchor="end" font-weight="normal">1</text>
<text x="40" y="194" font-size="13.8" fill="#666" text-anchor="end" font-weight="normal">2</text>
<text x="40" y="154" font-size="13.8" fill="#666" text-anchor="end" font-weight="normal">3</text>
<text x="40" y="114" font-size="13.8" fill="#666" text-anchor="end" font-weight="normal">4</text>
