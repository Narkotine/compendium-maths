<line x1="50" y1="30" x2="330" y2="30" stroke="#e3e3e3" stroke-width="1"/>
<line x1="50" y1="270" x2="339" y2="270" stroke="#222" stroke-width="1.6"/>
<polygon points="348,270 339,274.1 339,265.9" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="50" y1="270" x2="50" y2="21" stroke="#222" stroke-width="1.6"/>
