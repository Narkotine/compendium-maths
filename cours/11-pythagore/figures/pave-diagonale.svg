<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="Arial, Helvetica, sans-serif">
<title>Diagonale [AG] d’un pavé droit 6 × 3 × 2 : Pythagore utilisé deux fois</title>
<rect width="720" height="290" fill="white"/>
<polygon points="70,260 352.4,217.6 352.4,137.6" fill="#fdebd0" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="70" y1="260" x2="310" y2="260" stroke="#222" stroke-width="2"/>
<line x1="310" y1="260" x2="310" y2="180" stroke="#222" stroke-width="2"/>
<line x1="310" y1="180" x2="70" y2="180" stroke="#222" stroke-width="2"/>
<line x1="70" y1="180" x2="70" y2="260" stroke="#222" stroke-width="2"/>
<line x1="310" y1="260" x2="352.4" y2="217.6" stroke="#222" stroke-width="2"/>
<line x1="352.4" y1="217.6" x2="352.4" y2="137.6" stroke="#222" stroke-width="2"/>
<line x1="352.4" y1="137.6" x2="310" y2="180" stroke="#222" stroke-width="2"/>
<line x1="70" y1="180" x2="112.4" y2="137.6" stroke="#222" stroke-width="2"/>
<line x1="112.4" y1="137.6" x2="352.4" y2="137.6" stroke="#222" stroke-width="2"/>
<line x1="70" y1="260" x2="112.4" y2="217.6" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="112.4" y1="217.6" x2="352.4" y2="217.6" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="112.4" y1="217.6" x2="112.4" y2="137.6" stroke="#222" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="70" y1="260" x2="352.4" y2="217.6" stroke="#1f4e79" stroke-width="3" stroke-dasharray="7 4"/>
<line x1="70" y1="260" x2="352.4" y2="137.6" stroke="#c0392b" stroke-width="3.5"/>
<text x="58" y="276" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="316" y="278" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="364.4" y="229.6" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="98.4" y="223.6" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">D</text>
<text x="58" y="178" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">E</text>
<text x="294" y="172" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">F</text>
<text x="362.4" y="131.6" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">G</text>
<text x="106.4" y="129.6" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<text x="190" y="282" font-size="14.3" fill="#666" text-anchor="middle" font-weight="normal">AB = 6</text>
<text x="340" y="258" font-size="14.3" fill="#666" text-anchor="start" font-weight="normal">BC = 3</text>
<text x="364.4" y="195.6" font-size="14.3" fill="#666" text-anchor="start" font-weight="normal">CG = 2</text>
<text x="440" y="60" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="bold">Étape 1 — triangle ABC rectangle en B :</text>
<text x="440" y="82" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="normal">AC² = 6² + 3² = 45</text>
<text x="440" y="112" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">Étape 2 — triangle ACG rectangle en C :</text>
<text x="440" y="132" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal">AG² = AC² + CG² = 45 + 4 = 49</text>
<text x="440" y="152" font-size="16.5" fill="#c0392b" text-anchor="start" font-weight="bold">AG = 7</text>
<text x="440" y="186" font-size="13.2" fill="#666" text-anchor="start" font-weight="normal">Astuce : on garde AC² = 45,</text>
<text x="440" y="203.6" font-size="13.2" fill="#666" text-anchor="start" font-weight="normal">inutile de calculer √45.</text>
</svg>
