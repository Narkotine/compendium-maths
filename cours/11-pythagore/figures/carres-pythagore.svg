<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" font-family="Arial, Helvetica, sans-serif">
<title>Carrés construits sur les côtés d’un triangle 3-4-5 : 9 + 16 = 25</title>
<rect width="460" height="460" fill="white"/>
<polygon points="294,250 190,250 190,354 294,354" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2" stroke-linejoin="round"/>
<line x1="268" y1="250" x2="268" y2="354" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="294" y1="276" x2="190" y2="276" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="242" y1="250" x2="242" y2="354" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="294" y1="302" x2="190" y2="302" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="216" y1="250" x2="216" y2="354" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="294" y1="328" x2="190" y2="328" stroke="#1f4e79" stroke-width="0.8"/>
<polygon points="190,250 190,172 112,172 112,250" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2" stroke-linejoin="round"/>
<line x1="190" y1="224" x2="112" y2="224" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="164" y1="250" x2="164" y2="172" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="190" y1="198" x2="112" y2="198" stroke="#1f4e79" stroke-width="0.8"/>
<line x1="138" y1="250" x2="138" y2="172" stroke="#1f4e79" stroke-width="0.8"/>
<polygon points="190,172 294,250 372,146 268,68" fill="#fdebd0" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
<line x1="210.8" y1="187.6" x2="288.8" y2="83.6" stroke="#c0392b" stroke-width="0.8"/>
<line x1="205.6" y1="151.2" x2="309.6" y2="229.2" stroke="#c0392b" stroke-width="0.8"/>
<line x1="231.6" y1="203.2" x2="309.6" y2="99.2" stroke="#c0392b" stroke-width="0.8"/>
<line x1="221.2" y1="130.4" x2="325.2" y2="208.4" stroke="#c0392b" stroke-width="0.8"/>
<line x1="252.4" y1="218.8" x2="330.4" y2="114.8" stroke="#c0392b" stroke-width="0.8"/>
<line x1="236.8" y1="109.6" x2="340.8" y2="187.6" stroke="#c0392b" stroke-width="0.8"/>
<line x1="273.2" y1="234.4" x2="351.2" y2="130.4" stroke="#c0392b" stroke-width="0.8"/>
<line x1="252.4" y1="88.8" x2="356.4" y2="166.8" stroke="#c0392b" stroke-width="0.8"/>
<polygon points="190,250 294,250 190,172" fill="white" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="202,250 202,238 190,238" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="242" y="308" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="bold">16</text>
<text x="151" y="217" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="bold">9</text>
<text x="281" y="165" font-size="23.1" fill="#c0392b" text-anchor="middle" font-weight="bold">25</text>
<text x="180" y="268" font-size="15.8" fill="#222" text-anchor="end" font-weight="bold">A</text>
<text x="302" y="268" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">B</text>
<text x="182" y="166" font-size="15.8" fill="#222" text-anchor="end" font-weight="bold">C</text>
<text x="242" y="242" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="normal">4</text>
<text x="200" y="216" font-size="14.7" fill="#1f4e79" text-anchor="start" font-weight="normal">3</text>
<text x="230" y="221" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="normal">5</text>
<text x="230" y="420" font-size="15.8" fill="#222" text-anchor="middle" font-weight="normal">AC² = 9   ;   AB² = 16   ;   BC² = 25</text>
<text x="230" y="444" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">9 + 16 = 25 : le grand carré a la même aire que les deux petits réunis.</text>
</svg>
