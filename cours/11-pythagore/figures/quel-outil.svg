<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 366" width="540" height="366" font-family="Arial, Helvetica, sans-serif">
<title>Organigramme : théorème de Pythagore ou réciproque ?</title>
<rect width="540" height="366" fill="white"/>
<rect x="150" y="12" width="240" height="40" rx="9" fill="#f3f6fa" stroke="#222" stroke-width="2"/>
<text x="270" y="37" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">Que demande l’énoncé ?</text>
<rect x="20" y="92" width="230" height="62" rx="9" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/>
<text x="135" y="110" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Calculer une longueur</text>
<text x="135" y="128.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">dans un triangle</text>
<text x="135" y="147.8" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">qu’on SAIT rectangle</text>
<rect x="290" y="92" width="230" height="62" rx="9" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/>
<text x="405" y="110" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Savoir SI un triangle</text>
<text x="405" y="128.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">est rectangle</text>
<text x="405" y="147.8" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">(on connaît les 3 côtés)</text>
<line x1="230" y1="52" x2="143.4" y2="86.7" stroke="#222" stroke-width="1.8"/>
<polygon points="135,90 141.9,82.9 144.9,90.4" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="310" y1="52" x2="396.6" y2="86.7" stroke="#222" stroke-width="1.8"/>
<polygon points="405,90 395.1,90.4 398.1,82.9" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="20" y="184" width="230" height="84" rx="9" fill="white" stroke="#1f4e79" stroke-width="2"/>
<text x="135" y="204" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Théorème de Pythagore</text>
<text x="135" y="222.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">1. Repérer l’hypoténuse</text>
<text x="135" y="241.8" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">2. Écrire l’égalité</text>
<text x="135" y="260.7" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">3. Remplacer, calculer, √</text>
<rect x="290" y="184" width="230" height="84" rx="9" fill="white" stroke="#c0392b" stroke-width="2"/>
<text x="405" y="204" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Réciproque</text>
<text x="405" y="222.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">1. Repérer le plus grand côté</text>
<text x="405" y="241.8" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">2. Calculer séparément</text>
<text x="405" y="260.7" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">3. Comparer</text>
<line x1="135" y1="154" x2="135" y2="173" stroke="#222" stroke-width="1.8"/>
<polygon points="135,182 130.9,173 139.1,173" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="405" y1="154" x2="405" y2="173" stroke="#222" stroke-width="1.8"/>
<polygon points="405,182 400.9,173 409.1,173" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="282" y="300" width="116" height="52" rx="9" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
<text x="340" y="322" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Égalité</text>
<text x="340" y="340.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">→ rectangle</text>
<rect x="412" y="300" width="116" height="52" rx="9" fill="#f4f4f4" stroke="#666" stroke-width="2"/>
<text x="470" y="322" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Pas d’égalité</text>
<text x="470" y="340.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">→ pas rectangle</text>
<line x1="370" y1="268" x2="346.4" y2="291.6" stroke="#222" stroke-width="1.8"/>
<polygon points="340,298 343.5,288.8 349.2,294.5" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="440" y1="268" x2="463.6" y2="291.6" stroke="#222" stroke-width="1.8"/>
<polygon points="470,298 460.8,294.5 466.5,288.8" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<rect x="20" y="300" width="230" height="52" rx="9" fill="white" stroke="#1f4e79" stroke-width="2"/>
<text x="135" y="322" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">Le résultat est une longueur :</text>
<text x="135" y="340.9" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">unité + arrondi demandé</text>
<line x1="135" y1="268" x2="135" y2="289" stroke="#222" stroke-width="1.8"/>
<polygon points="135,298 130.9,289 139.1,289" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
</svg>
