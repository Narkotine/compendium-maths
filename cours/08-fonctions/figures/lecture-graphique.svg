<text x="352" y="64" font-size="13" fill="#1f4e79" text-anchor="end" font-weight="bold">courbe de f</text>
<text x="430" y="70" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">Lire une image :</text>
<text x="430" y="92" font-size="13" fill="#222" text-anchor="start" font-weight="normal">on part de x sur l’axe horizontal,</text>
<text x="430" y="112" font-size="13" fill="#222" text-anchor="start" font-weight="normal">on monte (ou descend) jusqu’à la courbe,</text>
<text x="430" y="132" font-size="13" fill="#222" text-anchor="start" font-weight="normal">on lit sur l’axe vertical.</text>
<text x="430" y="156" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="bold">Ici f(2) = −1,5.</text>
<text x="430" y="200" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">Lire des antécédents :</text>
<text x="430" y="222" font-size="13" fill="#222" text-anchor="start" font-weight="normal">on part de y sur l’axe vertical,</text>
<text x="430" y="242" font-size="13" fill="#222" text-anchor="start" font-weight="normal">on va horizontalement jusqu’à la courbe</text>
<text x="430" y="262" font-size="13" fill="#222" text-anchor="start" font-weight="normal">(tous les points !), on lit les x.</text>
<text x="430" y="286" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">Ici 2,5 a deux antécédents : −2 et 4.</text>
