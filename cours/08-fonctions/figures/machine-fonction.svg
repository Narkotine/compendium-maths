<svg xmlns="http://www.w3.org/2000/svg" viewBox="-56 0 792 238" width="792" height="238" font-family="Arial, Helvetica, sans-serif">
<title>Une fonction f est une machine qui transforme un nombre x en un unique nombre f(x) : ici 3 donne 7</title>
<rect x="-56" y="0" width="792" height="238" fill="white"/>
<rect x="250" y="40" width="180" height="90" rx="12" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.5"/>
<text x="340" y="80" font-size="26" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">f</text>
<text x="340" y="108" font-size="12" fill="#1f4e79" text-anchor="middle" font-weight="normal">multiplier par 2, puis ajouter 1</text>
<line x1="175" y1="85" x2="234" y2="85" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="245,85 234,90 234,80" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<line x1="435" y1="85" x2="494" y2="85" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>
<polygon points="505,85 494,90 494,80" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="150" y="93" font-size="37.2" fill="#222" text-anchor="middle" font-weight="bold">3</text>
<text x="530" y="93" font-size="37.2" fill="#c0392b" text-anchor="middle" font-weight="bold">7</text>
<text x="150" y="140" font-size="20.2" fill="#222" text-anchor="middle" font-weight="normal">nombre de départ x</text>
<text x="150" y="167.9" font-size="20.2" fill="#666" text-anchor="middle" font-weight="normal">(antécédent)</text>
<text x="530" y="140" font-size="20.2" fill="#c0392b" text-anchor="middle" font-weight="normal">nombre d’arrivée f(x)</text>
<text x="530" y="167.9" font-size="20.2" fill="#666" text-anchor="middle" font-weight="normal">(image)</text>
<text x="340" y="196" font-size="21.7" fill="#222" text-anchor="middle" font-weight="bold">f(3) = 2 × 3 + 1 = 7 : « l’image de 3 par f est 7 » ; « 3 est un antécédent de 7 ».</text>
<text x="340" y="233.2" font-size="21.7" fill="#1f4e79" text-anchor="middle" font-weight="normal">On écrit aussi f : x ⟼ 2x + 1.</text>
</svg>
