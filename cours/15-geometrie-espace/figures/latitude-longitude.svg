<text x="277.1" y="126.6" font-size="15.8" fill="#c0392b" text-anchor="start" font-weight="bold">M</text>
<text x="220" y="186" font-size="14.7" fill="#222" text-anchor="end" font-weight="bold">O</text>
<text x="230" y="50.2" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">pôle Nord</text>
<text x="255" y="186.3" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="bold">45°</text>
<text x="238.6" y="231.5" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">40°</text>
<text x="84" y="224" font-size="13.7" fill="#1f4e79" text-anchor="end" font-weight="bold">équateur</text>
<text x="180.7" y="350" font-size="13.7" fill="#2e7d32" text-anchor="middle" font-weight="bold">méridien de Greenwich</text>
<text x="104" y="86" font-size="12.6" fill="#666" text-anchor="end" font-weight="normal">parallèle 45° N</text>
<text x="400" y="60" font-size="13.7" fill="#222" text-anchor="start" font-weight="bold">Le point M a pour coordonnées :</text>
<text x="400" y="83.1" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• latitude 45° N : angle mesuré</text>
<text x="400" y="106.2" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">  depuis l’équateur, vers le nord ;</text>
<text x="400" y="129.3" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• longitude 40° E : angle mesuré</text>
<text x="400" y="152.4" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">  depuis le méridien de Greenwich,</text>
<text x="400" y="175.5" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">  vers l’est.</text>
<text x="400" y="202" font-size="13.7" fill="#222" text-anchor="start" font-weight="bold">Latitude : de 0° à 90° (N ou S).</text>
<text x="400" y="225.1" font-size="13.7" fill="#222" text-anchor="start" font-weight="bold">Longitude : de 0° à 180° (E ou O).</text>
</svg>
