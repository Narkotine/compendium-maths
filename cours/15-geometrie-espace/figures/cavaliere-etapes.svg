<text x="78" y="222" font-size="16.1" fill="#222" text-anchor="middle" font-weight="bold">1. Face avant</text>
<text x="78" y="240" font-size="14.9" fill="#666" text-anchor="middle" font-weight="normal">en vraie grandeur</text>
<line x1="200" y1="190" x2="300" y2="190" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>
