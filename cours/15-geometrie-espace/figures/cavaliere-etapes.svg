<text x="250" y="222" font-size="16.1" fill="#222" text-anchor="middle" font-weight="bold">2. Fuyantes</text>
<text x="250" y="240" font-size="14.9" fill="#666" text-anchor="middle" font-weight="normal">parallèles, × 0,5</text>
<line x1="372" y1="190" x2="472" y2="190" stroke="#222" stroke-width="2.4" stroke-linecap="round"/>
