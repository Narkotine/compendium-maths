<text x="188" y="106" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<text x="314" y="108" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">M</text>
<text x="190" y="156" font-size="13" fill="#1f4e79" text-anchor="end" font-weight="bold">d = 3</text>
<text x="252" y="132" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">r = ?</text>
<text x="266" y="165" font-size="13" fill="#222" text-anchor="start" font-weight="bold">R = 5</text>
<text x="380" y="80" font-size="13" fill="#222" text-anchor="start" font-weight="bold">Toute section d’une sphère par un plan</text>
<text x="380" y="98" font-size="13" fill="#222" text-anchor="start" font-weight="normal">est un cercle (le centre H est sur la</text>
<text x="380" y="116" font-size="13" fill="#222" text-anchor="start" font-weight="normal">perpendiculaire au plan passant par O).</text>
<text x="380" y="150" font-size="13" fill="#222" text-anchor="start" font-weight="normal">OHM est rectangle en H :</text>
<text x="380" y="170" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">r² = R² − d² = 25 − 9 = 16</text>
<text x="380" y="192" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">donc r = 4.</text>
<text x="380" y="230" font-size="13" fill="#666" text-anchor="start" font-weight="normal">Si d = 0 : grand cercle (r = R).</text>
