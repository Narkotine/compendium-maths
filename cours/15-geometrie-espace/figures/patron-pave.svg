<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" width="700" height="316" font-family="Arial, Helvetica, sans-serif">
<title>Un patron du pavé droit de 4 cm sur 3 cm sur 2 cm : les faces opposées sont identiques (même couleur)</title>
<rect width="700" height="316" fill="white"/>
<rect x="116" y="30" width="128" height="64" rx="0" fill="#fdebd0" stroke="#222" stroke-width="2"/>
<text x="180" y="67" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">avant 4 × 2</text>
<rect x="52" y="94" width="64" height="96" rx="0" fill="#e3f1e4" stroke="#222" stroke-width="2"/>
<text x="84" y="147" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">côté 2 × 3</text>
<rect x="116" y="94" width="128" height="96" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="2"/>
<text x="180" y="147" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">dessous 4 × 3</text>
<rect x="244" y="94" width="64" height="96" rx="0" fill="#e3f1e4" stroke="#222" stroke-width="2"/>
<text x="276" y="147" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">côté 2 × 3</text>
<rect x="308" y="94" width="128" height="96" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="2"/>
<text x="372" y="147" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">dessus 4 × 3</text>
<rect x="116" y="190" width="128" height="64" rx="0" fill="#fdebd0" stroke="#222" stroke-width="2"/>
<text x="180" y="227" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">arrière 4 × 2</text>
<text x="180" y="22" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">4 cm</text>
<text x="108" y="67" font-size="13.7" fill="#1f4e79" text-anchor="end" font-weight="bold">2 cm</text>
<text x="46" y="147" font-size="13.7" fill="#1f4e79" text-anchor="end" font-weight="bold">3 cm</text>
<polygon points="500,210 620,210 651.8,178.2 531.8,178.2" fill="#dbe8f5" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="500,270 620,270 620,210 500,210" fill="#fdebd0" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="620,270 651.8,238.2 651.8,178.2 620,210" fill="#e3f1e4" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="651.8" y1="238.2" x2="531.8" y2="238.2" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="500" y1="270" x2="531.8" y2="238.2" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="531.8" y1="238.2" x2="531.8" y2="178.2" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="500" y1="270" x2="620" y2="270" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="620" y1="270" x2="651.8" y2="238.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="500" y1="210" x2="620" y2="210" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="620" y1="210" x2="651.8" y2="178.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="651.8" y1="178.2" x2="531.8" y2="178.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="500" y1="210" x2="531.8" y2="178.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="620" y1="270" x2="620" y2="210" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="500" y1="270" x2="500" y2="210" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="651.8" y1="238.2" x2="651.8" y2="178.2" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="590" y="300" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">le pavé 4 cm × 3 cm × 2 cm</text>
