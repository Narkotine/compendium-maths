<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="Arial, Helvetica, sans-serif">
<title>Pavé droit ABCDEFGH de 6 cm sur 4 cm sur 3 cm en perspective cavalière : face avant en vraie grandeur, fuyantes à 45° réduites de moitié, arêtes cachées en pointillés</title>
<rect width="700" height="290" fill="white"/>
<polygon points="60,142 276,142 326.9,91.1 110.9,91.1" fill="#f4f4f4" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="60,250 276,250 276,142 60,142" fill="#dbe8f5" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polygon points="276,250 326.9,199.1 326.9,91.1 276,142" fill="#f4f4f4" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="326.9" y1="199.1" x2="110.9" y2="199.1" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="60" y1="250" x2="110.9" y2="199.1" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="110.9" y1="199.1" x2="110.9" y2="91.1" stroke="#222" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="60" y1="250" x2="276" y2="250" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="276" y1="250" x2="326.9" y2="199.1" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="142" x2="276" y2="142" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="276" y1="142" x2="326.9" y2="91.1" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="326.9" y1="91.1" x2="110.9" y2="91.1" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="142" x2="110.9" y2="91.1" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="276" y1="250" x2="276" y2="142" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="60" y1="250" x2="60" y2="142" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<line x1="326.9" y1="199.1" x2="326.9" y2="91.1" stroke="#222" stroke-width="2.2" stroke-linecap="round"/>
<text x="50" y="268" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">A</text>
<text x="284" y="268" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">B</text>
<text x="338.9" y="205.1" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">C</text>
<text x="98.9" y="193.1" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">D</text>
<text x="48" y="138" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">E</text>
<text x="282" y="134" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">F</text>
<text x="336.9" y="85.1" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">G</text>
<text x="102.9" y="81.1" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<text x="168" y="270" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">6 cm (vraie grandeur)</text>
<text x="50" y="201" font-size="13.7" fill="#1f4e79" text-anchor="end" font-weight="bold">3 cm</text>
<line x1="276" y1="250" x2="356" y2="250" stroke="#666" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<path d="M322,250 A46,46 0 0 0 308.5,217.5" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="336" y="242" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">45°</text>
<text x="316" y="270" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="bold">BC = 4 cm, dessinée 4 × 0,5 = 2 cm</text>
<text x="432" y="40" font-size="13.7" fill="#222" text-anchor="start" font-weight="bold">Règles de la perspective cavalière :</text>
<text x="432" y="63.1" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• face avant (ABFE) en vraie grandeur ;</text>
<text x="432" y="86.2" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• fuyantes parallèles entre elles,</text>
<text x="432" y="109.3" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">   inclinées de 45°, réduites (× 0,5) ;</text>
<text x="432" y="132.4" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• arêtes parallèles → traits parallèles ;</text>
<text x="432" y="155.5" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• arêtes cachées en pointillés</text>
<text x="432" y="178.6" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">   (ici [AD], [DC] et [DH]).</text>
</svg>
