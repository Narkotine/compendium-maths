<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 700 378" width="700" height="378" font-family="Arial, Helvetica, sans-serif">
<title>Patron d’un prisme droit à base triangulaire (côtés 3, 4, 5 et hauteur 6) et patron d’une pyramide régulière à base carrée</title>
<rect x="0" y="-6" width="700" height="378" fill="white"/>
<polygon points="30,222 96,222 96,90 30,90" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="96,222 184,222 184,90 96,90" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="184,222 294,222 294,90 184,90" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="96,90 184,90 96,24" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="96,222 184,222 96,288" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="105,90 105,81 96,81" fill="none" stroke="#222" stroke-width="1.5"/>
<polyline points="105,222 105,231 96,231" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="63" y="222" font-size="1.1" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="63" y="240" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text>
<text x="140" y="256" font-size="1.1" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="239" y="240" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">5</text>
<text x="302" y="161" font-size="13.7" fill="#1f4e79" text-anchor="start" font-weight="bold">6</text>
<text x="144" y="72" font-size="1.1" fill="#222" text-anchor="middle" font-weight="normal"></text>
<text x="146.6" y="84" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">4</text>
<text x="160" y="340" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Prisme droit : 2 triangles (bases)</text>
<text x="160" y="358.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">+ 3 rectangles de hauteur 6.</text>
<polygon points="485,165 555,165 555,235 485,235" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="485,165 555,165 520,93" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="555,165 555,235 627,200" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="555,235 485,235 520,307" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polygon points="485,235 485,165 413,200" fill="#fdebd0" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="520" y="205" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">base</text>
<text x="520" y="340" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Pyramide à base carrée : 1 carré</text>
<text x="520" y="358.9" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">+ 4 triangles isocèles identiques.</text>
</svg>
