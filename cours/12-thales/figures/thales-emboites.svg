<circle cx="242" cy="143.5" r="3.2" fill="#222" stroke="#222" stroke-width="1"/>
<text x="530" y="60" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">Si (DE) ∥ (BC), alors :</text>
