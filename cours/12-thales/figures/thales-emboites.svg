<text x="491" y="116" font-size="18.9" fill="#222" text-anchor="middle" font-weight="normal">=</text>
<text x="530" y="104" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AE</text>
<line x1="517.1" y1="110" x2="542.9" y2="110" stroke="#222" stroke-width="1.4" stroke-linecap="round"/>
<text x="530" y="128" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AC</text>
<text x="569" y="116" font-size="18.9" fill="#222" text-anchor="middle" font-weight="normal">=</text>
