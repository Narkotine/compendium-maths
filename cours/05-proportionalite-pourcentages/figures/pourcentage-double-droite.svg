<text x="48" y="153" font-size="15.8" fill="#c0392b" text-anchor="end" font-weight="bold">€</text>
<text x="60" y="222" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">100 % ↔ 80 € ; donc 10 % ↔ 8 € (÷ 10) ; 5 % ↔ 4 € (÷ 2) ; 15 % ↔ 8 + 4 = 12 €</text>
