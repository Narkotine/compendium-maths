<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 260" width="710" height="260" font-family="Arial, Helvetica, sans-serif">
<title>La hauteur relative à une base : à l’intérieur, confondue avec un côté, ou à l’extérieur du triangle en prolongeant la base</title>
<rect width="710" height="260" fill="white"/>
<polygon points="30,180 210,180 90,50" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="90" y1="50" x2="90" y2="180" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="100,180 100,170 90,170" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="96" y="115" font-size="15.4" fill="#c0392b" text-anchor="start" font-weight="bold">h</text>
<text x="120" y="202" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="bold">base</text>
<text x="120" y="228" font-size="14.3" fill="#222" text-anchor="middle" font-weight="bold">Triangle à angles aigus :</text>
<text x="120" y="247.8" font-size="14.3" fill="#222" text-anchor="middle" font-weight="normal">la hauteur est à l’intérieur.</text>
<polygon points="270,180 440,180 270,50" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<polyline points="282,180 282,168 270,168" fill="none" stroke="#222" stroke-width="1.5"/>
<line x1="270" y1="50" x2="270" y2="180" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<text x="262" y="120" font-size="15.4" fill="#c0392b" text-anchor="end" font-weight="bold">h</text>
<text x="355" y="202" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="bold">base</text>
<text x="355" y="228" font-size="14.3" fill="#222" text-anchor="middle" font-weight="bold">Triangle rectangle :</text>
<text x="355" y="247.8" font-size="14.3" fill="#222" text-anchor="middle" font-weight="normal">la hauteur est un côté.</text>
<polygon points="490,180 600,180 680,50" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="600" y1="180" x2="694" y2="180" stroke="#666" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="680" y1="50" x2="680" y2="180" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<polyline points="670,180 670,170 680,170" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="674" y="120" font-size="15.4" fill="#c0392b" text-anchor="end" font-weight="bold">h</text>
<text x="545" y="202" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="bold">base</text>
<text x="590" y="228" font-size="14.3" fill="#222" text-anchor="middle" font-weight="bold">Triangle à angle obtus :</text>
<text x="590" y="247.8" font-size="14.3" fill="#222" text-anchor="middle" font-weight="normal">on prolonge la base.</text>
</svg>
