<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="Arial, Helvetica, sans-serif">
<title>Formulaire des aires : rectangle, parallélogramme, triangle, trapèze, disque et triangle rectangle, avec les hauteurs en pointillés</title>
