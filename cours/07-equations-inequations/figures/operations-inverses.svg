<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" font-family="Arial, Helvetica, sans-serif">
<title>Remonter un programme de calcul : à l’aller x, multiplier par 3, ajouter 2, on obtient 11 ; au retour 11, soustraire 2 donne 9, diviser par 3 donne 3</title>
<rect width="660" height="240" fill="white"/>
<rect x="15" y="38" width="90" height="40" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/>
<text x="60" y="65" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">x</text>
<rect x="185" y="38" width="90" height="40" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/>
<text x="230" y="65" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">3x</text>
<rect x="355" y="38" width="90" height="40" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/>
<text x="400" y="65" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">3x + 2</text>
<rect x="525" y="38" width="90" height="40" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/>
<text x="570" y="65" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold">11</text>
<line x1="108" y1="58" x2="173" y2="58" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/>
<polygon points="182,58 173,62 173,54" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<text x="145" y="48" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">× 3</text>
<line x1="278" y1="58" x2="343" y2="58" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/>
<polygon points="352,58 343,62 343,54" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/>
<text x="315" y="48" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">+ 2</text>
<line x1="448" y1="58" x2="522" y2="58" stroke="#1f4e79" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="485" y="48" font-size="13" fill="#1f4e79" text-anchor="middle" font-weight="normal">résultat</text>
<rect x="15" y="148" width="90" height="40" rx="8" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/>
<text x="60" y="175" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">3</text>
<rect x="185" y="148" width="90" height="40" rx="8" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/>
<text x="230" y="175" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">9</text>
<rect x="355" y="148" width="90" height="40" rx="8" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/>
<text x="400" y="175" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">11</text>
<line x1="352" y1="168" x2="287" y2="168" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="278,168 287,163.9 287,172.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="315" y="158" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">− 2</text>
<line x1="182" y1="168" x2="117" y2="168" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<polygon points="108,168 117,163.9 117,172.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/>
<text x="145" y="158" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">÷ 3</text>
<text x="530" y="164" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal">on remonte :</text>
<text x="530" y="182" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal">opérations</text>
<text x="530" y="198" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal">inverses</text>
<text x="20" y="114" font-size="13" fill="#1f4e79" text-anchor="start" font-weight="bold">aller</text>
<text x="20" y="226" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">retour</text>
</svg>
