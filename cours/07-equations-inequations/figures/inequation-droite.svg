<line x1="60" y1="55" x2="60" y2="65" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="60" y="82" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−6</text>
<line x1="108.3" y1="55" x2="108.3" y2="65" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="108.3" y="82" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−5</text>
<line x1="156.7" y1="55" x2="156.7" y2="65" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="156.7" y="82" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−4</text>
