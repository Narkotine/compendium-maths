<text x="495" y="82" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">3</text>
<line x1="543.3" y1="55" x2="543.3" y2="65" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="543.3" y="82" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">4</text>
