<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200" font-family="Arial, Helvetica, sans-serif">
<title>Solutions d’inéquations sur une droite graduée : x supérieur ou égal à 3, demi-droite coloriée à partir de 3 inclus ; x strictement inférieur à −3, demi-droite coloriée avant −3 exclu</title>
<rect width="700" height="200" fill="white"/>
