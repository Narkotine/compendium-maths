<text x="156.7" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−4</text>
<line x1="205" y1="155" x2="205" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="205" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−3</text>
<line x1="253.3" y1="155" x2="253.3" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="253.3" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−2</text>
