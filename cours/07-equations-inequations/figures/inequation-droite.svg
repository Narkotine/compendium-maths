<text x="301.7" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">−1</text>
<line x1="350" y1="155" x2="350" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="350" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">0</text>
<line x1="398.3" y1="155" x2="398.3" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="398.3" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">1</text>
<line x1="446.7" y1="155" x2="446.7" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
