<polyline points="503,48 495,48 495,72 503,72" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
<text x="50" y="38" font-size="14.7" fill="#222" text-anchor="start" font-weight="bold">x ⩾ 3 : 3 est solution (crochet tourné vers les solutions)</text>
