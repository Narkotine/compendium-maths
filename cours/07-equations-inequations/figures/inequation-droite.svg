<line x1="543.3" y1="155" x2="543.3" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="543.3" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">4</text>
<line x1="591.7" y1="155" x2="591.7" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="591.7" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">5</text>
<line x1="640" y1="155" x2="640" y2="165" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
<text x="640" y="182" font-size="12.6" fill="#666" text-anchor="middle" font-weight="normal">6</text>
<line x1="54" y1="160" x2="205" y2="160" stroke="#2e7d32" stroke-width="6" stroke-linecap="round"/>
<polyline points="213,148 205,148 205,172 213,172" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/>
<text x="50" y="138" font-size="14.7" fill="#222" text-anchor="start" font-weight="bold">x &lt; −3 : −3 n’est pas solution (crochet tourné vers l’extérieur)</text>
