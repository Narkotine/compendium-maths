<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 344" width="660" height="344" font-family="Arial, Helvetica, sans-serif">
<title>Organigramme : trigonométrie, Pythagore ou Thalès ?</title>
<rect width="660" height="344" fill="white"/>
<rect x="165" y="18" width="330" height="44" rx="8" fill="#eeeeee" stroke="#222" stroke-width="2"/>
<text x="330" y="45.2" font-size="15.8" fill="#222" text-anchor="middle" font-weight="normal">Y a-t-il un triangle rectangle ?</text>
<line x1="250" y1="62" x2="167.9" y2="105.8" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="160,110 166,102.2 169.8,109.3" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="190" y="84" font-size="13.7" fill="#2e7d32" text-anchor="end" font-weight="bold">oui</text>
<line x1="410" y1="62" x2="492.1" y2="105.8" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="500,110 490.2,109.3 494,102.2" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="470" y="84" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="bold">non</text>
<rect x="15" y="111" width="290" height="58" rx="8" fill="#eeeeee" stroke="#222" stroke-width="2"/>
<text x="160" y="135.9" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Un angle aigu intervient-il</text>
<text x="160" y="154.8" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">(donné ou cherché) ?</text>
<rect x="375" y="111" width="250" height="58" rx="8" fill="#eeeeee" stroke="#222" stroke-width="2"/>
<text x="500" y="135.9" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">Deux parallèles coupent</text>
<text x="500" y="154.8" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">deux droites sécantes ?</text>
<line x1="100" y1="169" x2="91.7" y2="213.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="90,222 87.7,212.4 95.6,213.9" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="84" y="198" font-size="13.7" fill="#2e7d32" text-anchor="end" font-weight="bold">oui</text>
<line x1="220" y1="169" x2="245.6" y2="214.2" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="250,222 242,216.2 249.1,212.2" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="250" y="198" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="bold">non</text>
<line x1="500" y1="169" x2="500" y2="213" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>
<polygon points="500,222 495.9,213 504.1,213" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/>
<text x="510" y="198" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="bold">oui</text>
<rect x="10" y="224" width="160" height="76" rx="8" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/>
<text x="90" y="248.9" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">TRIGONOMÉTRIE</text>
<text x="90" y="267.8" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">cos, sin, tan</text>
<text x="90" y="286.7" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">(chapitre 13)</text>
<rect x="180" y="224" width="160" height="76" rx="8" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/>
<text x="260" y="248.9" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">PYTHAGORE</text>
<text x="260" y="267.8" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">2 côtés → le 3e</text>
<text x="260" y="286.7" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">(chapitre 11)</text>
<rect x="420" y="224" width="160" height="76" rx="8" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2"/>
<text x="500" y="248.9" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">THALÈS</text>
<text x="500" y="267.8" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">rapports égaux</text>
<text x="500" y="286.7" font-size="14.7" fill="#222" text-anchor="middle" font-weight="normal">(chapitre 12)</text>
<text x="330" y="330" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">3 côtés connus, on se demande si le triangle est rectangle : réciproque de Pythagore.</text>
</svg>
