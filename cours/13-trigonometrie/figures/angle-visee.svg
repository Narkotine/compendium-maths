<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" font-family="Arial, Helvetica, sans-serif">
<title>Angle de visée : un observateur à 20 m d’un immeuble vise le sommet sous un angle de 38°, ses yeux sont à 1,6 m du sol</title>
<rect width="620" height="350" fill="white"/>
<line x1="30" y1="300" x2="600" y2="300" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
<rect x="400" y="33.6" width="90" height="266.4" rx="0" fill="#eeeeee" stroke="#666" stroke-width="2"/>
<rect x="415" y="53.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="445" y="53.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="415" y="93.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="445" y="93.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="415" y="133.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="445" y="133.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="415" y="173.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="445" y="173.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="415" y="213.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<rect x="445" y="213.6" width="18" height="22" rx="0" fill="white" stroke="#666" stroke-width="1"/>
<line x1="100" y1="300" x2="100" y2="275" stroke="#1f4e79" stroke-width="4" stroke-linecap="round"/>
<circle cx="100" cy="268" r="7" fill="white" stroke="#1f4e79" stroke-width="2"/>
<line x1="100" y1="268" x2="400" y2="33.6" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="100" y1="268" x2="400" y2="268" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
<path d="M160,268 A60,60 0 0 0 147.3,231.1" fill="none" stroke="#222" stroke-width="2"/>
<text x="178" y="256" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold">38°</text>
<polyline points="388,268 388,256 400,256" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="250" y="288" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">20 m</text>
<text x="90" y="289" font-size="13.7" fill="#1f4e79" text-anchor="end" font-weight="normal">1,6 m</text>
<text x="390" y="155.8" font-size="15.8" fill="#c0392b" text-anchor="end" font-weight="bold">TH = ?</text>
<text x="94" y="254" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">E</text>
<text x="414" y="286" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">H</text>
<text x="414" y="29.6" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">T</text>
<text x="320" y="336" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">Triangle EHT rectangle en H : tan 38° = TH / EH. Hauteur totale = TH + 1,6 m.</text>
</svg>
