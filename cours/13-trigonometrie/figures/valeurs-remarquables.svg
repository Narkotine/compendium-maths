<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 364" width="560" height="364" font-family="Arial, Helvetica, sans-serif">
<title>Valeurs remarquables : demi-carré (angles de 45°) et demi-triangle équilatéral (angles de 30° et 60°)</title>
<rect width="560" height="364" fill="white"/>
<polygon points="60,240 180,240 180,120" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="168,240 168,228 180,228" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M96,240 A36,36 0 0 0 85.5,214.5" fill="none" stroke="#222" stroke-width="1.8"/>
<path d="M154.5,145.5 A36,36 0 0 0 180,156" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="112" y="230" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">45°</text>
<text x="166" y="176" font-size="13" fill="#222" text-anchor="end" font-weight="normal">45°</text>
<text x="120" y="262" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">1</text>
<text x="192" y="185" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="bold">1</text>
<text x="108.7" y="173.7" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">√2</text>
<text x="120" y="30" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Demi-carré</text>
<text x="120" y="52" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">diagonale : √(1² + 1²) = √2</text>
<polygon points="330,240 490,240 410,101.4" fill="none" stroke="#bbbbbb" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 4"/>
<polygon points="330,240 410,240 410,101.4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="398,240 398,228 410,228" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M364,240 A34,34 0 0 0 347,210.6" fill="none" stroke="#222" stroke-width="1.8"/>
<path d="M390,136.1 A40,40 0 0 0 410,141.4" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="376" y="230" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">60°</text>
<text x="402" y="161.4" font-size="13" fill="#222" text-anchor="end" font-weight="normal">30°</text>
<text x="370" y="262" font-size="15" fill="#1f4e79" text-anchor="middle" font-weight="bold">1</text>
<text x="356.1" y="167.7" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text>
<text x="422" y="175.7" font-size="15" fill="#1f4e79" text-anchor="start" font-weight="bold">√3</text>
<text x="410" y="30" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Demi-triangle équilatéral de côté 2</text>
<text x="410" y="52" font-size="13" fill="#666" text-anchor="middle" font-weight="normal">hauteur : √(2² − 1²) = √3</text>
<text x="280" y="300" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">cos 45° = sin 45° = 1/√2 ≈ 0,707</text>
<text x="280" y="324" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">cos 60° = sin 30° = 1/2</text>
<text x="280" y="348" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">sin 60° = cos 30° = √3/2 ≈ 0,866</text>
</svg>
