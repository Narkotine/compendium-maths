<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="Arial, Helvetica, sans-serif">
<title>Pente d’une route de 10 % : 10 m de dénivelé pour 100 m à l’horizontale, tan α = 0,1</title>
<rect width="620" height="320" fill="white"/>
<polygon points="40,250 520,250 520,160" fill="#eeeeee" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<line x1="40" y1="250" x2="520" y2="160" stroke="#555555" stroke-width="8" stroke-linecap="round"/>
<line x1="40" y1="250" x2="520" y2="160" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="12 10"/>
<polyline points="508,250 508,238 520,238" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M130,250 A90,90 0 0 0 128.5,233.4" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="152" y="244" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">α</text>
<text x="280" y="274" font-size="15.4" fill="#1f4e79" text-anchor="middle" font-weight="bold">distance horizontale : 100 m</text>
<text x="530" y="200" font-size="15.4" fill="#2e7d32" text-anchor="start" font-weight="bold">10 m</text>
<text x="530" y="216" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="normal">de dénivelé</text>
<polygon points="140,150 100,80 180,80" fill="white" stroke="#c0392b" stroke-width="5" stroke-linejoin="round"/>
<text x="140" y="108" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">10 %</text>
<line x1="140" y1="150" x2="140" y2="200" stroke="#666" stroke-width="3" stroke-linecap="round"/>
<text x="230" y="60" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">Pente de 10 % : on monte de 10 m</text>
<text x="230" y="82" font-size="15.4" fill="#222" text-anchor="start" font-weight="normal">pour 100 m parcourus à l’horizontale.</text>
<text x="230" y="112" font-size="16.5" fill="#c0392b" text-anchor="start" font-weight="bold">tan α = 10 / 100 = 0,1</text>
<text x="230" y="137.3" font-size="16.5" fill="#c0392b" text-anchor="start" font-weight="bold">donc α ≈ 5,7°</text>
<text x="300" y="306" font-size="14.3" fill="#666" text-anchor="middle" font-weight="normal">Dessin non à l’échelle verticale : une pente de 10 % est un angle faible.</text>
</svg>
