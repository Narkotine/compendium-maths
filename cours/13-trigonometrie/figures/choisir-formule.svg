<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 332" width="660" height="332" font-family="Arial, Helvetica, sans-serif">
<title>Choisir la formule : adjacent et hypoténuse, cosinus ; opposé et hypoténuse, sinus ; opposé et adjacent, tangente</title>
<rect width="660" height="332" fill="white"/>
<rect x="10" y="20" width="200" height="270" rx="10" fill="white" stroke="#1f4e79" stroke-width="2"/>
<polygon points="30,170 190,170 190,60" fill="none" stroke="#bbbbbb" stroke-width="2" stroke-linejoin="round"/>
<polyline points="179,170 179,159 190,159" fill="none" stroke="#999999" stroke-width="1.5"/>
<path d="M60,170 A30,30 0 0 0 54.7,153" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="30" y1="170" x2="190" y2="170" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
<line x1="30" y1="170" x2="190" y2="60" stroke="#1f4e79" stroke-width="5" stroke-linecap="round"/>
<text x="110" y="215" font-size="16.2" fill="#222" text-anchor="middle" font-weight="normal">adjacent et hypoténuse</text>
<text x="110" y="250" font-size="27.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">COSINUS</text>
<text x="110" y="276" font-size="17.5" fill="#1f4e79" text-anchor="middle" font-weight="normal">adjacent / hypoténuse</text>
<rect x="230" y="20" width="200" height="270" rx="10" fill="white" stroke="#2e7d32" stroke-width="2"/>
<polygon points="250,170 410,170 410,60" fill="none" stroke="#bbbbbb" stroke-width="2" stroke-linejoin="round"/>
<polyline points="399,170 399,159 410,159" fill="none" stroke="#999999" stroke-width="1.5"/>
<path d="M280,170 A30,30 0 0 0 274.7,153" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="410" y1="170" x2="410" y2="60" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
<line x1="250" y1="170" x2="410" y2="60" stroke="#2e7d32" stroke-width="5" stroke-linecap="round"/>
<text x="330" y="215" font-size="16.2" fill="#222" text-anchor="middle" font-weight="normal">opposé et hypoténuse</text>
<text x="330" y="250" font-size="27.5" fill="#2e7d32" text-anchor="middle" font-weight="bold">SINUS</text>
<text x="330" y="276" font-size="17.5" fill="#2e7d32" text-anchor="middle" font-weight="normal">opposé / hypoténuse</text>
<rect x="450" y="20" width="200" height="270" rx="10" fill="white" stroke="#c0392b" stroke-width="2"/>
<polygon points="470,170 630,170 630,60" fill="none" stroke="#bbbbbb" stroke-width="2" stroke-linejoin="round"/>
<polyline points="619,170 619,159 630,159" fill="none" stroke="#999999" stroke-width="1.5"/>
<path d="M500,170 A30,30 0 0 0 494.7,153" fill="none" stroke="#222" stroke-width="1.8"/>
<line x1="630" y1="170" x2="630" y2="60" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<line x1="470" y1="170" x2="630" y2="170" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
<text x="550" y="215" font-size="16.2" fill="#222" text-anchor="middle" font-weight="normal">opposé et adjacent</text>
<text x="550" y="250" font-size="27.5" fill="#c0392b" text-anchor="middle" font-weight="bold">TANGENTE</text>
<text x="550" y="276" font-size="17.5" fill="#c0392b" text-anchor="middle" font-weight="normal">opposé / adjacent</text>
<text x="330" y="318" font-size="16.2" fill="#222" text-anchor="middle" font-weight="normal">On repère les deux côtés qui interviennent (le connu et le cherché), puis on choisit la carte.</text>
</svg>
