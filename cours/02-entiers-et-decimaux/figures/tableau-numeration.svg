<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260" font-family="Arial, Helvetica, sans-serif">
<title>Tableau de numération des dizaines de mille aux millièmes : 3 507,26 puis 35 072,6 obtenu en multipliant par 10, chaque chiffre avançant d’un rang vers la gauche</title>
<rect width="740" height="260" fill="white"/>
<rect x="144" y="30" width="72" height="46" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="1.2"/>
<text x="180" y="50" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">dizaines de</text>
<text x="180" y="66" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">mille</text>
<rect x="216" y="30" width="72" height="46" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="1.2"/>
<text x="252" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">milliers</text>
<rect x="288" y="30" width="72" height="46" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="1.2"/>
<text x="324" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">centaines</text>
<rect x="360" y="30" width="72" height="46" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="1.2"/>
<text x="396" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">dizaines</text>
<rect x="432" y="30" width="72" height="46" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="1.2"/>
<text x="468" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">unités</text>
<rect x="504" y="30" width="72" height="46" rx="0" fill="#fdebd0" stroke="#222" stroke-width="1.2"/>
<text x="540" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">dixièmes</text>
<rect x="576" y="30" width="72" height="46" rx="0" fill="#fdebd0" stroke="#222" stroke-width="1.2"/>
<text x="612" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">centièmes</text>
<rect x="648" y="30" width="72" height="46" rx="0" fill="#fdebd0" stroke="#222" stroke-width="1.2"/>
<text x="684" y="58" font-size="12.6" fill="#222" text-anchor="middle" font-weight="normal">millièmes</text>
<rect x="20" y="76" width="124" height="40" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="82" y="102" font-size="14.7" fill="#222" text-anchor="middle" font-weight="bold">3 507,26</text>
<rect x="144" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<rect x="216" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="252" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text>
<rect x="288" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="324" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">5</text>
<rect x="360" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="396" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">0</text>
<rect x="432" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="468" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">7</text>
<rect x="504" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="540" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">2</text>
<rect x="576" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="612" y="104" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">6</text>
<rect x="648" y="76" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<rect x="20" y="116" width="124" height="40" rx="0" fill="#eeeeee" stroke="#222" stroke-width="1.2"/>
<text x="82" y="142" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">× 10 = 35 072,6</text>
<rect x="144" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="180" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">3</text>
<rect x="216" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="252" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">5</text>
<rect x="288" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="324" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">0</text>
<rect x="360" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="396" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">7</text>
<rect x="432" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="468" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text>
<rect x="504" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<text x="540" y="144" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="bold">6</text>
<rect x="576" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<rect x="648" y="116" width="72" height="40" rx="0" fill="white" stroke="#222" stroke-width="1.2"/>
<line x1="504" y1="30" x2="504" y2="156" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
<text x="504" y="176" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">virgule</text>
<text x="20" y="206" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• Chaque rang vaut 10 fois le rang situé à sa droite : 1 dizaine = 10 unités, 1 unité = 10 dixièmes.</text>
<text x="20" y="229.1" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• Multiplier par 10 : chaque chiffre avance d’un rang vers la gauche (la virgule, elle, ne bouge pas dans le tableau).</text>
<text x="20" y="252.2" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">• 3 507,26 = 3 × 1 000 + 5 × 100 + 7 × 1 + 2 × 0,1 + 6 × 0,01 = 3 507 + 26/100.</text>
</svg>
