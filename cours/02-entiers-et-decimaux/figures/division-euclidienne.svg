<text x="30" y="194" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal">5 œufs restent : 5 &lt; 6, on ne peut pas remplir une boîte de plus.</text>
<text x="430" y="150" font-size="30" fill="#222" text-anchor="start" font-weight="bold">47 = 6 × 7 + 5</text>
<text x="430" y="172" font-size="13" fill="#666" text-anchor="start" font-weight="normal">dividende = diviseur × quotient + reste</text>
