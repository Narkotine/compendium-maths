<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" width="640" height="394" font-family="Arial, Helvetica, sans-serif">
<title>Décomposition de 360 en facteurs premiers par un arbre et par divisions successives : 360 = 2 × 2 × 2 × 3 × 3 × 5</title>
<rect width="640" height="394" fill="white"/>
<text x="30" y="26" font-size="14.7" fill="#222" text-anchor="start" font-weight="bold">Arbre : on casse 360 en produits jusqu’à n’avoir que des nombres premiers (entourés).</text>
<text x="70" y="66" font-size="17.9" fill="#222" text-anchor="middle" font-weight="bold">360</text>
<line x1="64" y1="72" x2="44" y2="100" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<line x1="76" y1="72" x2="96" y2="100" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="38" cy="112" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="38" y="118" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">2</text>
<text x="102" y="118" font-size="17.9" fill="#222" text-anchor="middle" font-weight="bold">180</text>
<line x1="96" y1="124" x2="76" y2="152" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<line x1="108" y1="124" x2="128" y2="152" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="70" cy="164" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="70" y="170" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">2</text>
<text x="134" y="170" font-size="17.9" fill="#222" text-anchor="middle" font-weight="bold">90</text>
<line x1="128" y1="176" x2="108" y2="204" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<line x1="140" y1="176" x2="160" y2="204" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="102" cy="216" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="102" y="222" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">2</text>
<text x="166" y="222" font-size="17.9" fill="#222" text-anchor="middle" font-weight="bold">45</text>
<line x1="160" y1="228" x2="140" y2="256" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<line x1="172" y1="228" x2="192" y2="256" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="134" cy="268" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="134" y="274" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">3</text>
<text x="198" y="274" font-size="17.9" fill="#222" text-anchor="middle" font-weight="bold">15</text>
<line x1="192" y1="280" x2="172" y2="308" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<line x1="204" y1="280" x2="224" y2="308" stroke="#666" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="166" cy="320" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="166" y="326" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">3</text>
<circle cx="230" cy="320" r="14" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/>
<text x="230" y="326" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">5</text>
<text x="500" y="44" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">Divisions successives</text>
<text x="496" y="68" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">360</text>
<text x="514" y="68" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">2</text>
<text x="496" y="94" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">180</text>
<text x="514" y="94" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">2</text>
<text x="496" y="120" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">90</text>
<text x="514" y="120" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">2</text>
<text x="496" y="146" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">45</text>
<text x="514" y="146" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">3</text>
<text x="496" y="172" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">15</text>
<text x="514" y="172" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">3</text>
<text x="496" y="198" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">5</text>
<text x="514" y="198" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">5</text>
<text x="496" y="224" font-size="15.8" fill="#222" text-anchor="end" font-weight="normal">1</text>
<line x1="504" y1="52" x2="504" y2="206" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
<text x="30" y="352" font-size="18.9" fill="#c0392b" text-anchor="start" font-weight="bold">360 = 2 × 2 × 2 × 3 × 3 × 5 = 2³ × 3² × 5</text>
<text x="30" y="378" font-size="13.7" fill="#666" text-anchor="start" font-weight="normal">On essaie 2, puis 3, puis 5, puis 7… dans l’ordre ; on s’arrête quand il reste 1.</text>
</svg>
