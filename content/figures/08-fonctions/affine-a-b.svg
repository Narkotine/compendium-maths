art" font-weight="normal">   augmente de a.</text><text x="398" y="204" font-size="13" fill="#222" text-anchor="start" font-weight="normal">   Ici : x augmente de 2 → f(x)</text><text x="398" y="224" font-size="13" fill="#222" text-anchor="start" font-weight="normal">   augmente de 1, donc a = 1 ÷ 2 = 0,5.</text><text x="398" y="256" font-size="13" fill="#222" text-anchor="start" font-weight="normal">• a = (différence des images)</text><text x="398" y="276" font-size="13" fill="#222" text-anchor="start" font-weight="normal">        ÷ (différence des x).</text></g></svg>