<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" font-family="Arial, Helvetica, sans-serif"><title>Partage de 450 euros selon le ratio 2 : 3 : Léa reçoit 2 parts, Tom 3 parts ; une part vaut 90 euros ; Léa 180 euros, Tom 270 euros</title><rect width="620" height="240" fill="white"/><text x="106" y="98" font-size="15.8" fill="#1f4e79" text-anchor="end" font-weight="bold">Léa</text><text x="106" y="168" font-size="15.8" fill="#c0392b" text-anchor="end" font-weight="bold">Tom</text><rect x="120" y="70" width="90" height="42" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><text x="165" y="97" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="normal">90 €</text><rect x="210" y="70" width="90" height="42" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><text x="255" y="97" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="normal">90 €</text><rect x="120" y="140" width="90" height="42" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="165" y="167" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="normal">90 €</text><rect x="210" y="140" width="90" height="42" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="255" y="167" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="normal">90 €</text><rect x="300" y="140" width="90" height="42" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="345" y="167" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="normal">90 €</text><text x="316" y="97" font-size="14.7" fill="#1f4e79" text-anchor="start" font-weight="bold">2 parts → 180 €</text><text x="406" y="167" font-size="14.7" fill="#c0392b" text-anchor="start" font-weight="bold">3 parts → 270 €</text><text x="120" y="34" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">Partager 450 € entre Léa et Tom selon le ratio 2 : 3</text><text x="120" y="222" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">5 parts en tout : 1 part = 450 ÷ 5 = 90 €. Contrôle : 180 + 270 = 450 €.</text></svg>