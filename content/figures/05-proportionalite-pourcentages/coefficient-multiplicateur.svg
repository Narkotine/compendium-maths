<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" width="680" height="266" font-family="Arial, Helvetica, sans-serif"><title>Modèle en barres : 50 euros = 5 cases de 20 % ; une hausse de 20 % ajoute une case (120 %, multiplier par 1,2 : 60 euros) ; une baisse de 20 % en retire une (80 %, multiplier par 0,8 : 40 euros)</title><rect width="680" height="266" fill="white"/><text x="138" y="67" font-size="15.4" fill="#222" text-anchor="end" font-weight="bold">Prix de départ</text><rect x="150" y="40" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="182" y="66" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="normal">20 %</text><rect x="214" y="40" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="246" y="66" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="normal">20 %</text><rect x="278" y="40" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="310" y="66" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="normal">20 %</text><rect x="342" y="40" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="374" y="66" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="normal">20 %</text><rect x="406" y="40" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="438" y="66" font-size="14.3" fill="#1f4e79" text-anchor="middle" font-weight="normal">20 %</text><text x="552" y="58" font-size="17.6" fill="#222" text-anchor="start" font-weight="bold">50 €</text><text x="552" y="76" font-size="13" fill="#222" text-anchor="start" font-weight="normal">100 %</text><text x="138" y="135" font-size="15.4" fill="#222" text-anchor="end" font-weight="bold">Hausse de 20 %</text><rect x="150" y="108" width="64" height="40" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="182" y="134" font-size="14.3" fill="#1f4