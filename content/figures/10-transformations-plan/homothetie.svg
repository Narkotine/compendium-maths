<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" font-family="Arial, Helvetica, sans-serif"><title>Homothétie de centre O : de rapport 2, la figure est agrandie du même côté de O ; de rapport −0,5, elle est réduite de moitié et passe de l’autre côté de O</title><rect width="740" height="300" fill="white"/><line x1="40" y1="210" x2="180" y2="130" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="40" y1="210" x2="260" y2="190" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="40" y1="210" x2="200" y2="30" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="180,130 260,190 200,30" fill="#fdebd0" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/><polygon points="110,170 150,200 120,120" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.2" stroke-linejoin="round"/><circle cx="40" cy="210" r="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="36" y="230" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">O</text><text x="98" y="164" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">A</text><text x="166" y="124" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">A′</text><text x="154" y="220" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text><text x="270" y="210" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">B′</text><text x="108" y="114" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">C</text><text x="186" y="24" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">C′</text><text x="160" y="262" font-size="16.9" fill="#222" text-anchor="middle" font-weight="bold">Rapport k = 2 : OA′ = 2 × OA,</text><text x="160" y="285.4" font-size="16.9" fill="#222" text-anchor="middle" font-weight="normal">même côté de O ; longueurs × 2.</text><line x1="620" y1="90" x2="470" y2="165" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="660" y1="170" x2="450" y2="125" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="600" y1="190" x2="480" y2="115" stroke="#666" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="620,90 660,170 600,190" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.2" stroke-linejoin="round"/><polygon points="470,165 450,125 480,115" fill="#fdebd0" stroke="#c0392b" stroke-width="2.2" stroke-linejoin="round"/><circle cx="520" cy="140" r="4" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="522" y="130" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="bold">O</text><text x="628" y="84" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">A</text><text x="462" y="181" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">A′</text><text x="674" y="176" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text><text x="436" y="129" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">B′</text><text x="604" y="210" font-size="18.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">C</text><text x="476" y="105" font-size="18.2" fill="#c0392b" text-anchor="middle" font-weight="bold">C′</text><text x="560" y="262" font-size="16.9" fill="#222" text-anchor="middle" font-weight="bold">Rapport k = −0,5 : OA′ = 0,5 × OA,</text><text x="560" y="285.4" font-size="16.9" fill="#222" text-anchor="middle" font-weight="normal">de l’autre côté de O ; longueurs × 0,5.</text></svg>