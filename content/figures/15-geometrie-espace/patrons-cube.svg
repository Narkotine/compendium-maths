troke="#222" stroke-width="2"/><rect x="380" y="40" width="30" height="30" rx="0" fill="#fdebd0" stroke="#222" stroke-width="2"/><rect x="380" y="70" width="30" height="30" rx="0" fill="#e3f1e4" stroke="#222" stroke-width="2"/><rect x="410" y="70" width="30" height="30" rx="0" fill="#dbe8f5" stroke="#222" stroke-width="2"/><rect x="410" y="100" width="30" height="30" rx="0" fill="#fdebd0" stroke="#222" stroke-width="2"/><rect x="440" y="100" width="30" height="30" rx="0" fill="#e3f1e4" stroke="#222" stroke-width="2"/><polyline points="400,165 407,172 420,157" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linejoin="round"/><text x="410" y="196" font-size="18.8" fill="#222" text-anchor="middle" font-weight="bold">escalier</text><rect x="510" y="40" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><rect x="540" y="40" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><rect x="510" y="70" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><rect x="540" y="70" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><rect x="570" y="70" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><rect x="600" y="70" width="30" height="30" rx="0" fill="#eeeeee" stroke="#222" stroke-width="2"/><line x1="561" y1="156" x2="579" y2="174" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="561" y1="174" x2="579" y2="156" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="570" y="196" font-size="18.8" fill="#c0392b" text-anchor="middle" font-weight="bold">pas un patron</text><text x="350" y="222" font-size="18.8" fill="#222" text-anchor="middle" font-weight="normal">Même couleur = faces opposées du cube (elles ne se touchent jamais sur un patron).</text><text x="350" y="251" font-size="18.8" fill="#c0392b" text-anchor="middle" font-weight="normal">À droite : les deux carrés du haut viendraient se superposer au pliage.</te