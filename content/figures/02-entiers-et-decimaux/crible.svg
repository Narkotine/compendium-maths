ght="48" rx="6" fill="white" stroke="#bbb" stroke-width="1"/><text x="472" y="260" font-size="16.8" fill="#999" text-anchor="middle" font-weight="normal">49</text><rect x="500" y="230" width="48" height="48" rx="6" fill="white" stroke="#bbb" stroke-width="1"/><text x="524" y="260" font-size="16.8" fill="#999" text-anchor="middle" font-weight="normal">50</text><text x="570" y="50" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">Nombres premiers</text><text x="570" y="72" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">jusqu’à 50 : il y en a 15.</text><text x="570" y="110" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">On a barré les multiples</text><text x="570" y="128.9" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">de 2, 3, 5 et 7</text><text x="570" y="147.8" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">(sauf 2, 3, 5 et 7 eux-mêmes).</text><text x="570" y="184" font-size="13.7" fill="#666" text-anchor="start" font-weight="normal">1 n’est pas premier :</text><text x="570" y="202.9" font-size="13.7" fill="#666" text-anchor="start" font-weight="normal">il n’a qu’un seul diviseur.</text></svg>