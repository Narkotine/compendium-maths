<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="Arial, Helvetica, sans-serif"><title>Médiane d’une série rangée : avec 7 valeurs, c’est la 4e (9) ; avec 8 valeurs, c’est la moyenne des 4e et 5e (9 et 11), soit 10</title><rect width="640" height="250" fill="white"/><text x="20" y="56" font-size="14.3" fill="#222" text-anchor="start" font-weight="bold">7 valeurs (impair)</text><rect x="210" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="233" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">3</text><text x="233" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 1</text><rect x="262" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="285" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">5</text><text x="285" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 2</text><rect x="314" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="337" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">8</text><text x="337" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 3</text><rect x="366" y="30" width="46" height="40" rx="4" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="389" y="56" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">9</text><text x="389" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 4</text><rect x="418" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="441" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">11</text><text x="441" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 5</text><rect x="470" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="493" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">14</text><text x="493" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 6</text><rect x="522" y="30" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="545" y="56" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">20</text><text x="545" y="88" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 7</text><text x="389" y="112" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="bold">médiane = 9 (rang 4 : 3 valeurs de chaque côté)</text><text x="20" y="176" font-size="14.3" fill="#222" text-anchor="start" font-weight="bold">8 valeurs (pair)</text><rect x="210" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="233" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">3</text><text x="233" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 1</text><rect x="262" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="285" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">5</text><text x="285" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 2</text><rect x="314" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="337" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">8</text><text x="337" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 3</text><rect x="366" y="150" width="46" height="40" rx="4" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="389" y="176" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">9</text><text x="389" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 4</text><rect x="418" y="150" width="46" height="40" rx="4" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="441" y="176" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">11</text><text x="441" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 5</text><rect x="470" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="493" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">14</text><text x="493" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 6</text><rect x="522" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="545" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">20</text><text x="545" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 7</text><rect x="574" y="150" width="46" height="40" rx="4" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="597" y="176" font-size="16.5" fill="#222" text-anchor="middle" font-weight="bold">21</text><text x="597" y="208" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">rang 8</text><text x="415" y="232" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="bold">médiane = (9 + 11) ÷ 2 = 10 (entre les rangs 4 et 5)</text></svg>