<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" font-family="Arial, Helvetica, sans-serif"><title>Diagramme circulaire : moyen de transport de 30 élèves ; à pied 12 (144°), bus 9 (108°), voiture 6 (72°), vélo 3 (36°)</title><rect width="680" height="290" fill="white"/><path d="M160,150 L160,35 A115,115 0 0 0 92.4,243 Z" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><text x="92.2" y="133" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">144°</text><path d="M160,150 L92.4,243 A115,115 0 0 0 269.4,185.5 Z" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="182" y="222.8" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">108°</text><path d="M160,150 L269.4,185.5 A115,115 0 0 0 227.6,57 Z" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="227.8" y="133" font-size="13.7" fill="#2e7d32" text-anchor="middle" font-weight="bold">72°</text><path d="M160,150 L227.6,57 A115,115 0 0 0 160,35 Z" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.6"/><text x="182" y="87.2" font-size="13.7" fill="#b7950b" text-anchor="middle" font-weight="bold">36°</text><circle cx="160" cy="150" r="3" fill="#222" stroke="#222" stroke-width="1"/><rect x="320" y="57" width="18" height="18" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><text x="346" y="71" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">à pied : 12 élèves</text><text x="500" y="71" font-size="13.7" fill="#1f4e79" text-anchor="start" font-weight="normal">12/30 × 360° = 144°</text><rect x="320" y="91" width="18" height="18" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="346" y="105" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">bus : 9 élèves</text><text x="500" y="105" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="normal">9/30 × 360° = 108°</text><rect x="320" y="125" width="18" height="18" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="346" y="139" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">voiture : 6 élèves</text><text x="500" y="139" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="normal">6/30 × 360° = 72°</text><rect x="320" y="159" width="18" height="18" rx="0" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.6"/><text x="346" y="173" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal">vélo : 3 élèves</text><text x="500" y="173" font-size="13.7" fill="#b7950b" text-anchor="start" font-weight="normal">3/30 × 360° = 36°</text></svg>