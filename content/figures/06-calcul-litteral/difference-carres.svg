<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306" width="700" height="306" font-family="Arial, Helvetica, sans-serif"><title>Un carré de côté a privé d’un coin carré de côté b est découpé en deux rectangles P et Q, recollés en un rectangle de côtés a + b et a − b : a² − b² = (a + b)(a − b)</title><rect width="700" height="306" fill="white"/><polygon points="50,50 204,50 204,138 138,138 138,204 50,204" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/><rect x="50" y="50" width="88" height="154" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><rect x="138" y="50" width="66" height="88" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><rect x="138" y="138" width="66" height="66" rx="0" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="5 4"/><text x="171" y="176" font-size="15.8" fill="#666" text-anchor="middle" font-weight="normal" font-style="italic">b²</text><text x="94" y="133" font-size="16.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">P</text><text x="171" y="100" font-size="16.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">Q</text><text x="127" y="40" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">a</text><text x="40" y="132" font-size="15.8" fill="#222" text-anchor="end" font-weight="bold" font-style="italic">a</text><text x="212" y="99" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="normal" font-style="italic">a − b</text><text x="94" y="224" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="normal" font-style="italic">a − b</text><text x="127" y="252" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">a² − b² (carré privé d’un coin)</text><line x1="264" y1="127" x2="314" y2="127" stroke="#222" stroke-width="2" stroke-linecap="round"/><polygon points="324,127 314,131.5 314,122.5" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/><rect x="344" y="90" width="154" height="88" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><rect x="498" y="90" width="66" height="88" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="421" y="140" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">P (couché)</text><text x="531" y="140" font-size="16.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">Q</text><text x="421" y="80" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">a</text><text x="531" y="80" font-size="15.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">b</text><text x="572" y="139" font-size="13.7" fill="#222" text-anchor="start" font-weight="normal" font-style="italic">a − b</text><text x="454" y="208" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">rectangle (a + b) × (a − b)</text><text x="50" y="290" font-size="15.8" fill="#c0392b" text-anchor="start" font-weight="bold">Même aire avant et après : a² − b² = (a + b)(a − b).</text></svg>