<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 254" width="620" height="254" font-family="Arial, Helvetica, sans-serif"><title>Modèle d’aire : un rectangle de hauteur 3 et de largeur x + 4 est formé d’un rectangle d’aire 3x et d’un rectangle d’aire 12 ; 3(x + 4) = 3x + 12 ; développer de gauche à droite, factoriser de droite à gauche</title><rect width="620" height="254" fill="white"/><rect x="70" y="40" width="210" height="90" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/><rect x="280" y="40" width="120" height="90" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/><text x="175" y="91" font-size="17" fill="#1f4e79" text-anchor="middle" font-weight="bold">3 × x = 3x</text><text x="340" y="91" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold">3 × 4 = 12</text><text x="175" y="30" font-size="19.2" fill="#1f4e79" text-anchor="middle" font-weight="bold" font-style="italic">x</text><text x="340" y="30" font-size="19.2" fill="#c0392b" text-anchor="middle" font-weight="bold">4</text><text x="58" y="91" font-size="19.2" fill="#222" text-anchor="end" font-weight="bold">3</text><line x1="70" y1="144" x2="400" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="235" y="164" font-size="18" fill="#222" text-anchor="middle" font-weight="normal" font-style="italic">x + 4</text><text x="430" y="70" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">Aire totale :</text><text x="430" y="94" font-size="20.4" fill="#222" text-anchor="start" font-weight="bold">3(x + 4)</text><text x="430" y="125.2" font-size="20.4" fill="#222" text-anchor="start" font-weight="bold">= 3x + 12</text><line x1="90" y1="210" x2="251" y2="210" stroke="#2e7d32" stroke-width="2" stroke-linecap="round"/><polygon points="260,210 251,214.1 251,205.9" fill="#2e7d32" stroke="#2e7d32" stroke-width="1" stroke-linejoin="round"/><text x="175" y="200" font-size="15.6" fill="#2e7d32" text-anchor="middle" font-weight="bold">développer</text><line x1="460" y1="210" x2="299" y2="210" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><polygon points="290,210 299,205.9 299,214.1" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/><text x="375" y="200" font-size="15.6" fill="#c0392b" text-anchor="middle" font-weight="bold">factoriser</text><text x="275" y="236" font-size="19.2" fill="#222" text-anchor="middle" font-weight="bold">3(x + 4)   =   3x + 12</text></svg>