<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="Arial, Helvetica, sans-serif"><title>Modèle d’aire de la double distributivité : rectangle de côtés x + 3 et x + 5 découpé en quatre rectangles d’aires x², 5x, 3x et 15 ; (x + 3)(x + 5) = x² + 8x + 15</title><rect width="640" height="290" fill="white"/><rect x="70" y="40" width="168" height="168" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/><text x="154" y="130" font-size="15.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">x × x = x²</text><rect x="238" y="40" width="120" height="168" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2"/><text x="298" y="130" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">x × 5 = 5x</text><rect x="70" y="208" width="168" height="72" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="2"/><text x="154" y="250" font-size="15.8" fill="#2e7d32" text-anchor="middle" font-weight="bold">3 × x = 3x</text><rect x="238" y="208" width="120" height="72" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/><text x="298" y="250" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">3 × 5 = 15</text><text x="154" y="30" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold" font-style="italic">x</text><text x="298" y="30" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">5</text><text x="58" y="130" font-size="16.8" fill="#222" text-anchor="end" font-weight="bold" font-style="italic">x</text><text x="58" y="250" font-size="16.8" fill="#222" text-anchor="end" font-weight="bold">3</text><text x="388" y="80" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Aire du grand rectangle :</text><text x="388" y="108" font-size="17.9" fill="#222" text-anchor="start" font-weight="bold">(x + 3)(x + 5)</text><text x="388" y="140" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">= x² + 5x + 3x + 15</text><text x="388" y="170" font-size="17.9" fill="#c0392b" text-anchor="start" font-weight="bold">= x² + 8x + 15</text><text x="388" y="210" font-size="13.7" fill="#666" text-anchor="start" font-weight="normal">4 rectangles = 4 produits</text></svg>