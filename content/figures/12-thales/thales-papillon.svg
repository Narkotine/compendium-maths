<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="Arial, Helvetica, sans-serif"><title>Configuration papillon : les droites DB et EC se coupent en A, DE parallèle à BC ; mêmes rapports</title><rect width="680" height="300" fill="white"/><polygon points="190,130 300,270 90,270" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.5" stroke-linejoin="round"/><polygon points="190,130 129.5,53 245,53" fill="#fdebd0" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/><line x1="129.5" y1="53" x2="245" y2="53" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="270" x2="90" y2="270" stroke="#1f4e79" stroke-width="3" stroke-linecap="round"/><polyline points="181.4,57.2 188.4,53 181.4,48.8" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><polyline points="187.4,57.2 194.4,53 187.4,48.8" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-linejoin="round"/><polyline points="189.2,274.2 196.2,270 189.2,265.8" fill="none" stroke="#1f4e79" stroke-width="1.8" stroke-linejoin="round"/><polyline points="195.2,274.2 202.2,270 195.2,265.8" fill="none" stroke="#1f4e79" stroke-width="1.8" stroke-linejoin="round"/><text x="212" y="136" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">A</text><text x="312" y="288" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">B</text><text x="78" y="288" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">C</text><text x="119.5" y="45" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">D</text><text x="255" y="45" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">E</text><text x="530" y="50" font-size="14.7" fill="#666" text-anchor="middle" font-weight="normal">D, A, B alignés ; E, A, C alignés.</text><text x="530" y="80" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">Si (DE) ∥ (BC), alors :</text><text x="452" y="124" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AD</text><line x1="439.1" y1="130" x2="464.9" y2="130" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><text x="452" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AB</text><text x="491" y="136" font-size="18.9" fill="#222" text-anchor="middle" font-weight="normal">=</text><text x="530" y="124" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AE</text><line x1="517.1" y1="130" x2="542.9" y2="130" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><text x="530" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">AC</text><text x="569" y="136" font-size="18.9" fill="#222" text-anchor="middle" font-weight="normal">=</text><text x="608" y="124" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">DE</text><line x1="595.1" y1="130" x2="620.9" y2="130" stroke="#222" stroke-width="1.4" stroke-linecap="round"/><text x="608" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="normal">BC</text><text x="530" y="200" font-size="14.7" fill="#c0392b" text-anchor="middle" font-weight="bold">petit triangle ADE (au-dessus de A)</text><text x="530" y="223.1" font-size="14.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">grand triangle ABC (au-dessous de A)</text><text x="530" y="258" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">Mêmes rapports que pour les triangles emboîtés.</text></svg>