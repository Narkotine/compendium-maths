<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214" font-family="Arial, Helvetica, sans-serif"><title>Effet d’un agrandissement sur les aires : côté multiplié par 2, aire par 4 ; côté multiplié par 3, aire par 9</title><rect width="680" height="214" fill="white"/><rect x="40" y="106" width="34" height="34" rx="0" fill="#eeeeee" stroke="#666" stroke-width="2.5"/><text x="57" y="164" font-size="19.6" fill="#666" text-anchor="middle" font-weight="bold">côté × 1</text><text x="57" y="192" font-size="19.6" fill="#666" text-anchor="middle" font-weight="bold">aire × 1</text><rect x="150" y="72" width="68" height="68" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2.5"/><line x1="184" y1="140" x2="184" y2="72" stroke="#1f4e79" stroke-width="1" stroke-linecap="round"/><line x1="150" y1="106" x2="218" y2="106" stroke="#1f4e79" stroke-width="1" stroke-linecap="round"/><text x="184" y="164" font-size="19.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">côté × 2</text><text x="184" y="192" font-size="19.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">aire × 4</text><rect x="300" y="38" width="102" height="102" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="2.5"/><line x1="334" y1="140" x2="334" y2="38" stroke="#c0392b" stroke-width="1" stroke-linecap="round"/><line x1="300" y1="106" x2="402" y2="106" stroke="#c0392b" stroke-width="1" stroke-linecap="round"/><line x1="368" y1="140" x2="368" y2="38" stroke="#c0392b" stroke-width="1" stroke-linecap="round"/><line x1="300" y1="72" x2="402" y2="72" stroke="#c0392b" stroke-width="1" stroke-linecap="round"/><text x="351" y="164" font-size="19.6" fill="#c0392b" text-anchor="middle" font-weight="bold">côté × 3</text><text x="351" y="192" font-size="19.6" fill="#c0392b" text-anchor="middle" font-weight="bold">aire × 9</text><text x="560" y="40" font-size="22.4" fill="#222" text-anchor="middle" font-weight="bold">Longueurs × k</text><text x="560" y="82" font-size="22.4" fill="#c0392b" text-anchor="middle" font-weight="bold">Aires × k²</text><text x="560" y="124" font-size="22.4" fill="#1f4e79" text-anchor="middle" font-weight="bold">Volumes × k³</text><text x="560" y="146" font-size="15" fill="#666" text-anchor="middle" font-weight="normal">côté × 3 → 9 carreaux,</text><text x="560" y="166" font-size="15" fill="#666" text-anchor="middle" font-weight="normal">pas 3 !</text></svg>