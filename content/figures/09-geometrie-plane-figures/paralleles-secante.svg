<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="Arial, Helvetica, sans-serif"><title>Deux droites parallèles coupées par une sécante : les angles alternes-internes sont égaux, les angles correspondants sont égaux</title><rect width="720" height="260" fill="white"/><line x1="20" y1="70" x2="340" y2="70" stroke="#1f4e79" stroke-width="2.2" stroke-linecap="round"/><line x1="20" y1="170" x2="340" y2="170" stroke="#1f4e79" stroke-width="2.2" stroke-linecap="round"/><line x1="139.8" y1="209" x2="242.5" y2="31" stroke="#222" stroke-width="2.2" stroke-linecap="round"/><text x="24" y="62" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="bold">(d)</text><text x="24" y="162" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="bold">(d′)</text><text x="248.5" y="35" font-size="14.3" fill="#222" text-anchor="start" font-weight="bold">(t)</text><circle cx="220" cy="70" r="3" fill="#222" stroke="#222" stroke-width="1"/><circle cx="162.3" cy="170" r="3" fill="#222" stroke="#222" stroke-width="1"/><text x="232" y="62" font-size="15.4" fill="#222" text-anchor="middle" font-weight="bold">A</text><text x="150.3" y="190" font-size="15.4" fill="#222" text-anchor="middle" font-weight="bold">B</text><path d="M220,70 L192,70 A28,28 0 0 0 206,94.2 Z" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><path d="M162.3,170 L190.3,170 A28,28 0 0 0 176.3,145.8 Z" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="176" y="96" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text><text x="206.3" y="158" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="bold">60°</text><text x="180" y="222" font-size="14.3" fill="#222" text-anchor="middle" font-weight="bold">Angles alternes-internes : de part et d’autre de (t),</text><text x="180" y="241.8" font-size="14.3" fill="#222" text-anchor="middle" font-weight="normal">entre (d) et (d′).</text><line x1="380" y1="70" x2="700" y2="70" stroke="#1f4e79" stroke-width="2.2" stroke-linecap="round"/><line x1="380" y1="170" x2="700" y2="170" stroke="#1f4e79" stroke-width="2.2" stroke-linecap="round"/><line x1="499.8" y1="209" x2="602.5" y2="31" stroke="#222" stroke-width="2.2" stroke-linecap="round"/><text x="384" y="62" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="bold">(d)</text><text x="384" y="162" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="bold">(d′)</text><text x="608.5" y="35" font-size="14.3" fill="#222" text-anchor="start" font-weight="bold">(t)</text><circle cx="580" cy="70" r="3" fill="#222" stroke="#222" stroke-width="1"/><circle cx="522.3" cy="170" r="3" fill="#222" stroke="#222" stroke-width="1"/><text x="592" y="62" font-size="15.4" fill="#222" text-anchor="middle" font-weight="bold">A</text><text x="510.3" y="190" font-size="15.4" fill="#222" text-anchor="middle" font-weight="bold">B</text><path d="M580,70 L608,70 A28,28 0 0 0 594,45.8 Z" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.8"/><path d="M522.3,170 L550.3,170 A28,28 0 0 0 536.3,145.8 Z" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.8"/><text x="624" y="58" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">60°</text><text x="566.3" y="158" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="bold">60°</text><text x="540" y="222" font-size="14.3" fill="#222" text-anchor="middle" font-weight="bold">Angles correspondants : même position</text><text x="540" y="241.8" font-size="14.3" fill="#222" text-anchor="middle" font-weight="normal">par rapport à (t) et à chaque droite.</text></svg>