<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" width="500" height="290" font-family="Arial, Helvetica, sans-serif"><title>Figure de l’exercice B4 : roue partagée en un demi-disque rouge, un quart de disque bleu, un secteur vert de 60° et un secteur jaune de 30°</title><rect width="500" height="290" fill="white"/><path d="M150,150 L150,40 A110,110 0 0 0 150,260 Z" fill="#fdebd0" stroke="#c0392b" stroke-width="1.6"/><text x="81.8" y="155" font-size="16.8" fill="#c0392b" text-anchor="middle" font-weight="bold">R</text><path d="M150,150 L150,260 A110,110 0 0 0 260,150 Z" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.6"/><text x="198.2" y="203.2" font-size="16.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text><path d="M150,150 L260,150 A110,110 0 0 0 205,54.7 Z" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.6"/><text x="209.1" y="120.9" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold">V</text><path d="M150,150 L205,54.7 A110,110 0 0 0 150,40 Z" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.6"/><text x="167.7" y="89.1" font-size="16.8" fill="#b7950b" text-anchor="middle" font-weight="bold">J</text><circle cx="150" cy="150" r="4" fill="#222" stroke="#222" stroke-width="1"/><polyline points="164,150 164,164 150,164" fill="none" stroke="#222" stroke-width="1.5"/><text x="300" y="90" font-size="13.7" fill="#c0392b" text-anchor="start" font-weight="normal">R : rouge (demi-disque)</text><text x="300" y="116.2" font-size="13.7" fill="#1f4e79" text-anchor="start" font-weight="normal">B : bleu (quart de disque)</text><text x="300" y="142.5" font-size="13.7" fill="#2e7d32" text-anchor="start" font-weight="normal">V : vert (angle de 60°)</text><text x="300" y="168.8" font-size="13.7" fill="#b7950b" text-anchor="start" font-weight="normal">J : jaune (angle de 30°)</text></svg>