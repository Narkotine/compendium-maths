<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="Arial, Helvetica, sans-serif"><title>Échelle des probabilités de 0 (impossible) à 1 (certain), avec des exemples pris sur un dé : obtenir 7 (0), obtenir 6 (1 sur 6), pile (0,5), ne pas obtenir 6 (5 sur 6), obtenir moins de 7 (1)</title><rect width="760" height="190" fill="white"/><line x1="110" y1="120" x2="680" y2="120" stroke="#222" stroke-width="2.4" stroke-linecap="round"/><line x1="110" y1="112" x2="110" y2="128" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="110" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">0</text><text x="110" y="168" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="normal">impossible</text><line x1="252.5" y1="112" x2="252.5" y2="128" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="252.5" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">0,25</text><text x="252.5" y="168" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="normal">peu probable</text><line x1="395" y1="112" x2="395" y2="128" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="395" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">0,5</text><text x="395" y="168" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="normal">une chance sur deux</text><line x1="537.5" y1="112" x2="537.5" y2="128" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="537.5" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">0,75</text><text x="537.5" y="168" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="normal">très probable</text><line x1="680" y1="112" x2="680" y2="128" stroke="#222" stroke-width="2" stroke-linecap="round"/><text x="680" y="148" font-size="16.8" fill="#222" text-anchor="middle" font-weight="bold">1</text><text x="680" y="168" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="normal">certain</text><circle cx="110" cy="120" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="110" y1="114" x2="110" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="110" y="90" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">obtenir 7 avec un dé</text><circle cx="205" cy="120" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="205" y1="114" x2="205" y2="64" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="205" y="58" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">obtenir 6</text><circle cx="395" cy="120" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="395" y1="114" x2="395" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="395" y="90" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">pile</text><circle cx="585" cy="120" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="585" y1="114" x2="585" y2="64" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="585" y="58" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">ne pas obtenir 6</text><circle cx="680" cy="120" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="680" y1="114" x2="680" y2="96" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="680" y="90" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">obtenir moins de 7</text></svg>