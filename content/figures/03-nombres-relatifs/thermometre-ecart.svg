<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" width="620" height="370" font-family="Arial, Helvetica, sans-serif"><title>Thermomètre gradué de −10 à +10 °C : la température passe de −4 °C le matin à +3 °C l’après-midi ; elle monte de 4 degrés jusqu’à 0 puis de 3 degrés : écart de 7 degrés, soit 3 − (−4) = 7</title><rect width="620" height="370" fill="white"/><rect x="186" y="18" width="28" height="324" rx="14" fill="white" stroke="#222" stroke-width="1.8"/><circle cx="200" cy="356" r="20" fill="#fdebd0" stroke="#222" stroke-width="1.8"/><rect x="194" y="135" width="12" height="207" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="0"/><circle cx="200" cy="356" r="14" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><line x1="194" y1="135" x2="194" y2="344" stroke="#c0392b" stroke-width="0.01" stroke-linecap="round"/><rect x="195" y="135" width="10" height="209" fill="#c0392b"/><line x1="214" y1="330" x2="228" y2="330" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="176" y="335" font-size="18.9" fill="#222" text-anchor="end" font-weight="normal">−10</text><line x1="214" y1="315" x2="221" y2="315" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="300" x2="221" y2="300" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="285" x2="221" y2="285" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="270" x2="221" y2="270" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="255" x2="228" y2="255" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><line x1="214" y1="240" x2="221" y2="240" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="176" y="245" font-size="18.9" fill="#222" text-anchor="end" font-weight="normal">−4</text><line x1="214" y1="225" x2="221" y2="225" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="210" x2="221" y2="210" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="195" x2="221" y2="195" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="180" x2="228" y2="180" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="176" y="185" font-size="18.9" fill="#1f4e79" text-anchor="end" font-weight="bold">0</text><line x1="214" y1="165" x2="221" y2="165" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="150" x2="221" y2="150" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="135" x2="221" y2="135" stroke="#222" stroke-width="1" stroke-linecap="round"/><text x="176" y="140" font-size="18.9" fill="#222" text-anchor="end" font-weight="normal">+3</text><line x1="214" y1="120" x2="221" y2="120" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="105" x2="228" y2="105" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="176" y="110" font-size="18.9" fill="#222" text-anchor="end" font-weight="normal">+5</text><line x1="214" y1="90" x2="221" y2="90" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="75" x2="221" y2="75" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="60" x2="221" y2="60" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="45" x2="221" y2="45" stroke="#222" stroke-width="1" stroke-linecap="round"/><line x1="214" y1="30" x2="228" y2="30" stroke="#222" stroke-width="1.5" stroke-linecap="round"/><text x="176" y="35" font-size="18.9" fill="#222" text-anchor="end" font-weight="normal">+10</text><line x1="214" y1="180" x2="260" y2="180" stroke="#1f4e79" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><text x="264" y="185" font-size="17.6" fill="#1f4e79" text-anchor="start" font-weight="normal">0 °C</text><line x1="230" y1="240" x2="320" y2="240" stroke="#2e7d32" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="230" y1="135" x2="320" y2="135" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round" s