<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 224" width="754" height="224" font-family="Arial, Helvetica, sans-serif"><title>Droite graduée de −6 à 6 : A d’abscisse −3 et B d’abscisse 3 sont opposés, à la distance 3 de zéro ; C d’abscisse −5 est à gauche de A, donc −5 est plus petit que −3</title><rect x="0" y="0" width="754" height="224" fill="white"/><line x1="28" y1="80" x2="666" y2="80" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><polygon points="676,80 666,84.5 666,75.5" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/><line x1="50" y1="73" x2="50" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="50" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−6</text><line x1="100" y1="73" x2="100" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="100" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−5</text><line x1="150" y1="73" x2="150" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="150" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−4</text><line x1="200" y1="73" x2="200" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="200" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−3</text><line x1="250" y1="73" x2="250" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="250" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−2</text><line x1="300" y1="73" x2="300" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="300" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">−1</text><line x1="350" y1="73" x2="350" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="350" y="106" font-size="17.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">0</text><line x1="400" y1="73" x2="400" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="400" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">1</text><line x1="450" y1="73" x2="450" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="450" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">2</text><line x1="500" y1="73" x2="500" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="500" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">3</text><line x1="550" y1="73" x2="550" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="550" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">4</text><line x1="600" y1="73" x2="600" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="600" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">5</text><line x1="650" y1="73" x2="650" y2="87" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><text x="650" y="106" font-size="17.5" fill="#222" text-anchor="middle" font-weight="normal">6</text><circle cx="200" cy="80" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="200" y="64" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="bold">A</text><circle cx="500" cy="80" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="500" y="64" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="bold">B</text><circle cx="100" cy="80" r="6" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="100" y="64" font-size="20" fill="#1f4e79" text-anchor="middle" font-weight="bold">C</text><line x1="200" y1="128" x2="350" y2="128" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="350" y1="128" x2="500" y2="128" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="200" y1="122" x2="200" y2="134" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="350" y1="122" x2="350" y2="134" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="500" y1="122" x2="500" y2="134" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><text x="275" y="150" font-size="16.2" fill="#c0392b" text-anchor="middle" font-weight="normal">distance 3</text><text x="425" y="150" font-size="16.2" fill="#c0392b" text-anchor="middle" font-weight="normal">distance 3</text><text x="30" y="150" font-size="15" fill="#666" text-anchor="start" font-weight="normal">← négatifs</text><text x="670" y="150" font-size="15" fill="#666" text-anchor="end" font-weight="normal">positifs →</text><text x="50" y="184" font-size="17.5" fill="#222" text-anchor="start" font-weight="normal">A(−3) et B(3) sont opposés : même distance à zéro (3), de part et d’autre de 0.</text><text x="50" y="211.5" font-size="17.5" fill="#222" text-anchor="start" font-weight="normal">C(−5) est à gauche de A(−3), donc −5 &lt; −3 : plus un nombre est à gauche, plus il est petit.</text></svg>