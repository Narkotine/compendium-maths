<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" font-family="Arial, Helvetica, sans-serif"><title>Jetons : trois jetons plus et cinq jetons moins ; on forme trois paires plus-moins qui valent zéro ; il reste deux jetons moins : (+3) + (−5) = −2</title><rect width="720" height="210" fill="white"/><text x="30" y="30" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">Un jeton + et un jeton − s’annulent : (+1) + (−1) = 0.</text><text x="30" y="80" font-size="15.8" fill="#1f4e79" text-anchor="start" font-weight="bold">(+3)</text><text x="30" y="140" font-size="15.8" fill="#c0392b" text-anchor="start" font-weight="bold">(−5)</text><circle cx="110" cy="75" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="110" y="81" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="110" cy="135" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="110" y="141" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="154" cy="75" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="154" y="81" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="154" cy="135" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="154" y="141" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="198" cy="75" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="198" y="81" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="198" cy="135" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="198" y="141" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="242" cy="135" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="242" y="141" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="286" cy="135" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="286" y="141" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><rect x="90" y="55" width="40" height="100" rx="10" fill="none" stroke="#2e7d32" stroke-width="1.8"/><rect x="134" y="55" width="40" height="100" rx="10" fill="none" stroke="#2e7d32" stroke-width="1.8"/><rect x="178" y="55" width="40" height="100" rx="10" fill="none" stroke="#2e7d32" stroke-width="1.8"/><text x="154" y="190" font-size="13.7" fill="#2e7d32" text-anchor="middle" font-weight="bold">3 paires nulles</text><line x1="330" y1="105" x2="390" y2="105" stroke="#222" stroke-width="2" stroke-linecap="round"/><polygon points="400,105 390,109.5 390,100.5" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/><circle cx="440" cy="105" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="440" y="111" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="484" cy="105" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="484" y="111" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><text x="462" y="150" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">il reste 2 jetons −</text><text x="560" y="110" font-size="17.9" fill="#222" text-anchor="start" font-weight="bold">(+3) + (−5) = −2</text></svg>