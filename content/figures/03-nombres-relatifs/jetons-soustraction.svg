<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="Arial, Helvetica, sans-serif"><title>Jetons : pour calculer 2 − (−3), on part de deux jetons plus, on ajoute trois paires nulles, puis on enlève trois jetons moins ; il reste cinq jetons plus : 2 − (−3) = 5, soustraire revient à ajouter l’opposé</title><rect width="720" height="240" fill="white"/><text x="30" y="28" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">2 − (−3) : on doit enlever 3 jetons −, mais il n’y en a pas.</text><text x="30" y="74" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">① départ : 2</text><circle cx="170" cy="69" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="170" y="75" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="214" cy="69" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="214" y="75" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><text x="30" y="134" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">② on ajoute 3 paires nulles</text><text x="30" y="152" font-size="12.6" fill="#666" text-anchor="start" font-weight="normal">(la valeur ne change pas)</text><circle cx="250" cy="120" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="250" y="126" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="294" cy="120" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="294" y="126" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="338" cy="120" r="15" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.8"/><text x="338" y="126" font-size="18.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">+</text><circle cx="250" cy="160" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="250" y="166" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="294" cy="160" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="294" y="166" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><circle cx="338" cy="160" r="15" fill="#fdebd0" stroke="#c0392b" stroke-width="1.8"/><text x="338" y="166" font-size="18.9" fill="#c0392b" text-anchor="middle" font-weight="bold">−</text><rect x="228" y="98" width="132" height="84" rx="10" fill="none" stroke="#2e7d32" stroke-width="1.6"/><text x="30" y="222" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">③ on enlève les 3 jetons −</text><line x1="237" y1="147" x2="263" y2="173" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="237" y1="173" x2="263" y2="147" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="281" y1="147" x2="307" y2="173" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="281" y1="173" x2="307" y2="147" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="325" y1="147" x2="351" y2="173" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="325" y1="173" x2="351" y2="147" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="440" y="74" font-size="15.8" fill="#1f4e79" text-anchor="start" font-weight="bold">Il reste 2 + 3 = 5 jetons + :</text><text x="440" y="98" font-size="17.9" fill="#222" text-anchor="start" font-weight="bold">2 − (−3) = 2 + (+3) = 5</text><text x="440" y="140" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Enlever 3 jetons − revient</text><text x="440" y="161" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">à ajouter 3 jetons + :</text><text x="440" y="186" font-size="15.8" fill="#2e7d32" text-anchor="start" font-weight="bold">soustraire, c’est ajouter l’opposé.</text></svg>