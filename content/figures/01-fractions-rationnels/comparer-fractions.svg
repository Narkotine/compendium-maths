<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family="Arial, Helvetica, sans-serif"><title>Comparer des fractions : 3/5 est plus grand que 3/8 car les cinquièmes sont plus grands que les huitièmes ; 2/3 = 8/12 et 3/4 = 9/12, donc 2/3 est plus petit que 3/4</title><rect width="720" height="306" fill="white"/><text x="30" y="26" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">Même numérateur : 3/5 et 3/8</text><rect x="90" y="40" width="60" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="150" y="40" width="60" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="210" y="40" width="60" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="270" y="40" width="60" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="330" y="40" width="60" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="90" y="40" width="300" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/><text x="55" y="56" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text><line x1="47.4" y1="61" x2="62.6" y2="61" stroke="#1f4e79" stroke-width="1.6" stroke-linecap="round"/><text x="55" y="77" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">5</text><rect x="90" y="84" width="37.5" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="127.5" y="84" width="37.5" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="165" y="84" width="37.5" height="34" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="202.5" y="84" width="37.5" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="240" y="84" width="37.5" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="277.5" y="84" width="37.5" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="315" y="84" width="37.5" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="352.5" y="84" width="37.5" height="34" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="90" y="84" width="300" height="34" rx="0" fill="none" stroke="#222" stroke-width="2"/><text x="55" y="100" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text><line x1="47.4" y1="105" x2="62.6" y2="105" stroke="#1f4e79" stroke-width="1.6" stroke-linecap="round"/><text x="55" y="121" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">8</text><text x="410" y="64" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="normal">parts plus grandes</text><text x="410" y="108" font-size="14.3" fill="#666" text-anchor="start" font-weight="normal">parts plus petites</text><text x="410" y="132" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">donc 3/5 > 3/8</text><text x="30" y="172" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">Dénominateurs différents : 2/3 et 3/4, recoupés en douzièmes</text><rect x="90" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="130" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="170" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="210" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="250" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="290" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="330" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="370" y="186" width="40" height="34" rx="0" fill="#e3f1e4" stroke="#2e7d32" stroke-width="1.3"/><rect x="410" y="186" width="40" height="34" rx="0" fill="white"