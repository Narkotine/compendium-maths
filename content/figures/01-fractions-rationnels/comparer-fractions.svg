eight="34" rx="0" fill="none" stroke="#222" stroke-width="2"/><text x="55" y="246" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">3</text><line x1="47.4" y1="251" x2="62.6" y2="251" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><text x="55" y="267" font-size="16.5" fill="#c0392b" text-anchor="middle" font-weight="bold">4</text><line x1="250" y1="182" x2="250" y2="224" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><line x1="410" y1="182" x2="410" y2="224" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="226" x2="210" y2="268" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="330" y1="226" x2="330" y2="268" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="226" x2="450" y2="268" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="590" y="208" font-size="16.5" fill="#2e7d32" text-anchor="start" font-weight="bold">= 8/12</text><text x="590" y="252" font-size="16.5" fill="#c0392b" text-anchor="start" font-weight="bold">= 9/12</text><text x="90" y="292" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">8/12 &lt; 9/12, donc 2/3 &lt; 3/4.</text></svg>