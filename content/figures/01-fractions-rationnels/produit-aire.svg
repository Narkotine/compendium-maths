<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Arial, Helvetica, sans-serif"><title>Modèle d’aire : dans un carré unité découpé en 3 colonnes et 4 lignes, le rectangle de 2/3 de la largeur et 3/4 de la hauteur contient 6 cases sur 12 : 2/3 × 3/4 = 6/12 = 1/2</title><rect width="720" height="300" fill="white"/><rect x="80" y="40" width="240" height="240" rx="0" fill="white" stroke="#222" stroke-width="2"/><rect x="80" y="40" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="80" y="100" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="80" y="160" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="80" y="220" width="80" height="60" rx="0" fill="#dbe8f5" stroke="none" stroke-width="0"/><rect x="160" y="40" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="160" y="100" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="160" y="160" width="80" height="60" rx="0" fill="#c8b8e8" stroke="none" stroke-width="0"/><rect x="160" y="220" width="80" height="60" rx="0" fill="#dbe8f5" stroke="none" stroke-width="0"/><rect x="240" y="40" width="80" height="60" rx="0" fill="#fdebd0" stroke="none" stroke-width="0"/><rect x="240" y="100" width="80" height="60" rx="0" fill="#fdebd0" stroke="none" stroke-width="0"/><rect x="240" y="160" width="80" height="60" rx="0" fill="#fdebd0" stroke="none" stroke-width="0"/><rect x="240" y="220" width="80" height="60" rx="0" fill="white" stroke="none" stroke-width="0"/><line x1="160" y1="40" x2="160" y2="280" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="40" x2="240" y2="280" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="100" x2="320" y2="100" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="160" x2="320" y2="160" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="220" x2="320" y2="220" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><rect x="80" y="40" width="240" height="240" rx="0" fill="none" stroke="#222" stroke-width="2.4"/><rect x="80" y="40" width="160" height="180" rx="0" fill="none" stroke="#c0392b" stroke-width="3"/><line x1="80" y1="28" x2="240" y2="28" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/><text x="160" y="22" font-size="15.6" fill="#1f4e79" text-anchor="middle" font-weight="bold">2/3 de la largeur</text><line x1="68" y1="40" x2="68" y2="220" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><text x="62" y="130" font-size="15.6" fill="#c0392b" text-anchor="end" font-weight="bold">3/4</text><text x="62" y="146" font-size="12" fill="#c0392b" text-anchor="end" font-weight="normal">de la</text><text x="62" y="160" font-size="12" fill="#c0392b" text-anchor="end" font-weight="normal">hauteur</text><text x="370" y="90" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">Le carré unité a une aire de 1.</text><text x="370" y="121.2" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">Il est découpé en 3 × 4 = 12 cases.</text><text x="370" y="152.4" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">Le rectangle encadré contient</text><text x="370" y="176.4" font-size="16.8" fill="#222" text-anchor="start" font-weight="normal">2 × 3 = 6 cases.</text><text x="370" y="200" font-size="18" fill="#c0392b" text-anchor="start" font-weight="bold">2/3 × 3/4 = (2 × 3)/(3 × 4) = 6/12 = 1/2</text><text x="370" y="226" font-size="15.6" fill="#666" text-anchor="start" font-weight="normal">numérateurs entre eux,</text><text x="370" y="247.6" font-size="15.6" fill="#666" text-anchor="start" font-weight="normal">dénominateurs entre eux</text></svg>