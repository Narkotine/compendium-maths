<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="Arial, Helvetica, sans-serif"><title>Barre unité partagée en 8 parts égales dont 3 sont coloriées : 3/8 ; puis deux barres partagées en quarts, l’une entière et l’autre avec 3 quarts coloriés : 7/4 = 1 + 3/4</title><rect width="720" height="240" fill="white"/><text x="30" y="30" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">L’unité est partagée en 8 parts égales ; on en prend 3.</text><rect x="30" y="46" width="55" height="44" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="85" y="46" width="55" height="44" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="140" y="46" width="55" height="44" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.3"/><rect x="195" y="46" width="55" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="250" y="46" width="55" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="305" y="46" width="55" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="360" y="46" width="55" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="415" y="46" width="55" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="30" y="46" width="440" height="44" rx="0" fill="none" stroke="#222" stroke-width="2"/><text x="510" y="67" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="bold">3</text><line x1="500.8" y1="72" x2="519.2" y2="72" stroke="#1f4e79" stroke-width="1.6" stroke-linecap="round"/><text x="510" y="93" font-size="22" fill="#1f4e79" text-anchor="middle" font-weight="bold">8</text><text x="545" y="66" font-size="14.3" fill="#1f4e79" text-anchor="start" font-weight="normal">← 3 parts prises</text><text x="545" y="90.2" font-size="14.3" fill="#666" text-anchor="start" font-weight="normal">← 8 parts dans l’unité</text><text x="30" y="140" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">Une fraction peut dépasser 1 : 7 quarts = 4 quarts + 3 quarts.</text><rect x="30" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="90" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="150" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="210" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="30" y="156" width="240" height="44" rx="0" fill="none" stroke="#222" stroke-width="2"/><rect x="290" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="350" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="410" y="156" width="60" height="44" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="1.3"/><rect x="470" y="156" width="60" height="44" rx="0" fill="white" stroke="#666" stroke-width="1.3"/><rect x="290" y="156" width="240" height="44" rx="0" fill="none" stroke="#222" stroke-width="2"/><text x="150" y="222" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="normal">1 unité</text><text x="410" y="222" font-size="14.3" fill="#c0392b" text-anchor="middle" font-weight="normal">3/4 d’unité</text><text x="580" y="177" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="bold">7</text><line x1="570.8" y1="182" x2="589.2" y2="182" stroke="#c0392b" stroke-width="1.6" stroke-linecap="round"/><text x="580" y="203" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="bold">4</text><text x="620" y="188" font-size="17.6" fill="#c0392b" text-anchor="start" font-weight="bold">= 1 + 3/4</text></svg>