<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160" font-family="Arial, Helvetica, sans-serif"><title>Demi-droite graduée de 0 à 2, unité partagée en quatre : points d’abscisses 1/4, 3/4, 5/4 et 7/4 ; 2/4 = 1/2</title><rect width="700" height="160" fill="white"/><line x1="40" y1="80" x2="660" y2="80" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><polygon points="670,80 660,84.5 660,75.5" fill="#222" stroke="#222" stroke-width="1" stroke-linejoin="round"/><line x1="50" y1="71" x2="50" y2="89" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><text x="50" y="110" font-size="17.6" fill="#222" text-anchor="middle" font-weight="bold">0</text><line x1="116.7" y1="74" x2="116.7" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="183.3" y1="74" x2="183.3" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="250" y1="74" x2="250" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="316.7" y1="71" x2="316.7" y2="89" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><text x="316.7" y="110" font-size="17.6" fill="#222" text-anchor="middle" font-weight="bold">1</text><line x1="383.3" y1="74" x2="383.3" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="450" y1="74" x2="450" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="516.7" y1="74" x2="516.7" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="583.3" y1="71" x2="583.3" y2="89" stroke="#222" stroke-width="1.8" stroke-linecap="round"/><text x="583.3" y="110" font-size="17.6" fill="#222" text-anchor="middle" font-weight="bold">2</text><line x1="650" y1="74" x2="650" y2="86" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><circle cx="116.7" cy="80" r="6" fill="#1f4e79" stroke="#1f4e79" stroke-width="1"/><text x="116.7" y="41" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="bold">1</text><line x1="109" y1