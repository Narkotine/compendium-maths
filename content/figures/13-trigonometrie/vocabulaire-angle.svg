<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 332" width="710" height="332" font-family="Arial, Helvetica, sans-serif"><title>Triangle ABC rectangle en B : pour l’angle en A, AB est adjacent et BC opposé ; pour l’angle en C, c’est l’inverse</title><rect width="710" height="332" fill="white"/><polygon points="35,250 265,250 265,80" fill="#fafafa" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polyline points="251,250 251,236 265,236" fill="none" stroke="#222" stroke-width="1.5"/><line x1="35" y1="250" x2="265" y2="80" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><line x1="35" y1="250" x2="265" y2="250" stroke="#1f4e79" stroke-width="4" stroke-linecap="round"/><line x1="265" y1="250" x2="265" y2="80" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/><path d="M35,250 L73,250 A38,38 0 0 0 65.6,227.4 Z" fill="#fdebd0" stroke="#222" stroke-width="2"/><path d="M73,250 A38,38 0 0 0 65.6,227.4" fill="none" stroke="#222" stroke-width="2"/><text x="150" y="274" font-size="16.2" fill="#1f4e79" text-anchor="middle" font-weight="bold">adjacent à l’angle en A</text><text x="279" y="170" font-size="16.2" fill="#2e7d32" text-anchor="start" font-weight="bold">opposé</text><text x="279" y="190" font-size="16.2" fill="#2e7d32" text-anchor="start" font-weight="bold">à l’angle</text><text x="155" y="40" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Pour l’angle en A</text><text x="140.5" y="157.1" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" transform="rotate(-36.5 140.5 157.1)">hypoténuse</text><text x="23" y="256" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">A</text><text x="275" y="270" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">B</text><text x="273" y="72" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">C</text><polygon points="385,250 615,250 615,80" fill="#fafafa" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polyline points="601,250 601,236 615,236" fill="none" stroke="#222" stroke-width="1.5"/><line x1="385" y1="250" x2="615" y2="80" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/><line x1="615" y1="250" x2="615" y2="80" stroke="#1f4e79" stroke-width="4" stroke-linecap="round"/><line x1="385" y1="250" x2="615" y2="250" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/><path d="M615,80 L587.7,100.2 A34,34 0 0 0 615,114 Z" fill="#fdebd0" stroke="#222" stroke-width="2"/><path d="M587.7,100.2 A34,34 0 0 0 615,114" fill="none" stroke="#222" stroke-width="2"/><text x="500" y="274" font-size="16.2" fill="#2e7d32" text-anchor="middle" font-weight="bold">opposé à l’angle en C</text><text x="629" y="170" font-size="16.2" fill="#1f4e79" text-anchor="start" font-weight="bold">adjacent</text><text x="629" y="190" font-size="16.2" fill="#1f4e79" text-anchor="start" font-weight="bold">à l’angle</text><text x="505" y="40" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">Pour l’angle en C</text><text x="490.5" y="157.1" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" transform="rotate(-36.5 490.5 157.1)">hypoténuse</text><text x="373" y="256" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">A</text><text x="625" y="270" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">B</text><text x="623" y="72" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">C</text><line x1="347" y1="30" x2="347" y2="290" stroke="#dddddd" stroke-width="1.5" stroke-linecap="round"/><text x="355" y="318" font-size="16.2" fill="#222" text-anchor="middle" font-weight="normal">L’hypoténuse ne change pas. Adjacent et opposé s’échangent quand on change d’angle.</text></svg>