<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" font-family="Arial, Helvetica, sans-serif"><title>D’où viennent les formules : un parallélogramme se transforme en rectangle, un triangle est la moitié d’un parallélogramme, deux trapèzes forment un parallélogramme</title><rect width="700" height="360" fill="white"/><polygon points="20,130 150,130 190,40 60,40" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="20,130 60,130 60,40" fill="#fdebd0" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/><line x1="60" y1="40" x2="60" y2="130" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="80" y1="170" x2="161" y2="170" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><polygon points="170,170 161,174.1 161,165.9" fill="#c0392b" stroke="#c0392b" stroke-width="1" stroke-linejoin="round"/><text x="125" y="162" font-size="13.8" fill="#c0392b" text-anchor="middle" font-weight="normal">on déplace le triangle</text><polygon points="60,300 150,300 190,210 60,210" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="150,300 190,300 190,210" fill="#fdebd0" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/><text x="125" y="330" font-size="14.9" fill="#222" text-anchor="middle" font-weight="bold">Parallélogramme = rectangle</text><text x="125" y="350.7" font-size="14.9" fill="#222" text-anchor="middle" font-weight="normal">de même base et même hauteur</text><polygon points="395,260 445,170 305,170" fill="none" stroke="#666" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4"/><polygon points="255,260 395,260 305,170" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/><line x1="305" y1="170" x2="305" y2="260" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><text x="311" y="225" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">h</text><text x="385" y="200" font-size="13.8" fill="#666" text-anchor="middle" font-weight="normal">copie</text><text x="350" y="330" font-size="14.9" fill="#222" text-anchor="middle" font-weight="bold">Triangle = moitié d’un</text><text x="350" y="350.7" font-size="14.9" fill="#222" text-anchor="middle" font-weight="normal">parallélogramme : b × h ÷ 2</text><line x1="325" y1="274" x2="262" y2="274" stroke="#1f4e79" stroke-width="1.4" stroke-linecap="round"/><polygon points="255,274 262,270.9 262,277.1" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/><line x1="325" y1="274" x2="388" y2="274" stroke="#1f4e79" stroke-width="1.4" stroke-linecap="round"/><polygon points="395,274 388,277.1 388,270.9" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/><text x="325" y="290" font-size="14.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">b</text><polygon points="470,260 580,260 550,190 500,190" fill="#dbe8f5" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="580,260 630,260 660,190 550,190" fill="#eeeeee" stroke="#666" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="525" y="278" font-size="13.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">B</text><text x="605" y="278" font-size="13.8" fill="#666" text-anchor="middle" font-weight="bold">b</text><text x="525" y="184" font-size="13.8" fill="#1f4e79" text-anchor="middle" font-weight="bold">b</text><text x="605" y="184" font-size="13.8" fill="#666" text-anchor="middle" font-weight="bold">B</text><text x="565" y="330" font-size="14.9" fill="#222" text-anchor="middle" font-weight="bold">Deux trapèzes = parallélogramme</text><text x="565" y="350.7" font-size="14.9" fill="#222" text-anchor="middle" font-weight="normal">de base B + b : (B + b) × h ÷ 2</text><line x1="550" y1="292" x2="477" y2="292" stroke="#1f4e79" stroke-width="1.4" stroke-linecap="round"/><polygon points="470,292 477,288.9 477,295.1" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/><line x1="550" y1="292" x2="623" y2="292" stroke="#1f4e79" stroke-width="1.4" stroke-linecap="round"/><polygon points="630,292 623,295.1 623,288.9" fill="#1f4e79" stroke="#1f4e79" stroke-width="1" stroke-linejoin="round"/><text x="550" y="308" font-size="14.9" fill="#1f4e79" text-anchor="middle" font-weight="bold">B + b</text><text x="360" y="24" font-size="16.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">Toutes les formules viennent de l’aire du rectangle.</text></svg>