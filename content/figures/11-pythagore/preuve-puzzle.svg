<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 266" width="480" height="266" font-family="Arial, Helvetica, sans-serif"><title>Preuve par puzzle : deux carrés de côté a+b contenant 4 triangles identiques</title><rect width="480" height="266" fill="white"/><polygon points="30,40 184,40 184,194 30,194" fill="white" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="30,40 96,40 30,128" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="184,40 184,106 96,40" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="184,194 118,194 184,106" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="30,194 30,128 118,194" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="96,40 184,106 118,194 30,128" fill="#fdebd0" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/><text x="107" y="125" font-size="23.1" fill="#c0392b" text-anchor="middle" font-weight="bold">c²</text><text x="63" y="34" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">a</text><text x="140" y="34" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">b</text><polygon points="270,40 424,40 424,194 270,194" fill="white" stroke="#222" stroke-width="2" stroke-linejoin="round"/><polygon points="270,40 336,40 336,106 270,106" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2" stroke-linejoin="round"/><polygon points="336,106 424,106 424,194 336,194" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2" stroke-linejoin="round"/><polygon points="336,40 424,40 336,106" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="424,40 424,106 336,106" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="270,106 336,106 270,194" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><polygon points="336,106 336,194 270,194" fill="#eeeeee" stroke="#222" stroke-width="1.5" stroke-linejoin="round"/><text x="303" y="80" font-size="21" fill="#1f4e79" text-anchor="middle" font-weight="bold">a²</text><text x="380" y="157" font-size="23.1" fill="#1f4e79" text-anchor="middle" font-weight="bold">b²</text><text x="303" y="34" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">a</text><text x="380" y="34" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">b</text><text x="107" y="22" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Grand carré n°1</text><text x="347" y="22" font-size="13.7" fill="#222" text-anchor="middle" font-weight="bold">Grand carré n°2</text><text x="240" y="123" font-size="27.3" fill="#222" text-anchor="middle" font-weight="normal">=</text><text x="240" y="230" font-size="13.7" fill="#222" text-anchor="middle" font-weight="normal">Même grand carré de côté a + b, mêmes 4 triangles gris (côtés a et b).</text><text x="240" y="250" font-size="15.8" fill="#c0392b" text-anchor="middle" font-weight="bold">Ce qui reste a donc la même aire :  c² = a² + b².</text></svg>