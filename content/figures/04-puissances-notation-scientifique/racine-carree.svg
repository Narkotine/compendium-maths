<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 268" width="740" height="268" font-family="Arial, Helvetica, sans-serif"><title>Racine carrée : un carré d’aire 25 a pour côté 5 ; un carré d’aire 30 a pour côté √30, environ 5,48, compris entre 5 et 6 car 25 &lt; 30 &lt; 36</title><rect width="740" height="268" fill="white"/><rect x="50" y="60" width="150" height="150" rx="0" fill="#dbe8f5" stroke="#1f4e79" stroke-width="2"/><text x="125" y="141" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold">aire 25</text><text x="125" y="50" font-size="15.4" fill="#1f4e79" text-anchor="middle" font-weight="bold">côté √25 = 5</text><rect x="280" y="45.7" width="164.3" height="164.3" rx="0" fill="#fdebd0" stroke="#c0392b" stroke-width="2"/><text x="362.2" y="133.8" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">aire 30</text><text x="362.2" y="35.7" font-size="15.4" fill="#c0392b" text-anchor="middle" font-weight="bold">côté √30 ≈ 5,48</text><line x1="470" y1="140" x2="710" y2="140" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><line x1="480" y1="132" x2="480" y2="148" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="502" y1="136" x2="502" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="524" y1="136" x2="524" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="546" y1="136" x2="546" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="568" y1="136" x2="568" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="590" y1="136" x2="590" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="612" y1="136" x2="612" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="634" y1="136" x2="634" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="656" y1="136" x2="656" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="678" y1="136" x2="678" y2="144" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><line x1="700" y1="132" x2="700" y2="148" stroke="#222" stroke-width="1.2" stroke-linecap="round"/><text x="480" y="166" font-size="15.4" fill="#222" text-anchor="middle" font-weight="normal">5</text><text x="700" y="166" font-size="15.4" fill="#222" text-anchor="middle" font-weight="normal">6</text><text x="480" y="184" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">(5² = 25)</text><text x="700" y="184" font-size="12.1" fill="#666" text-anchor="middle" font-weight="normal">(6² = 36)</text><circle cx="585" cy="140" r="6" fill="#c0392b" stroke="#c0392b" stroke-width="1"/><text x="585" y="124" font-size="15.4" fill="#c0392b" text-anchor="middle" font-weight="bold">√30</text><text x="470" y="80" font-size="14.3" fill="#222" text-anchor="start" font-weight="normal">25 &lt; 30 &lt; 36, donc</text><text x="470" y="100" font-size="16.5" fill="#222" text-anchor="start" font-weight="bold">5 &lt; √30 &lt; 6</text><text x="30" y="250" font-size="15.4" fill="#222" text-anchor="start" font-weight="bold">√a est la longueur du côté d’un carré d’aire a : c’est le nombre positif dont le carré vaut a.</text></svg>