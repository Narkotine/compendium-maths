<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" width="760" height="238" font-family="Arial, Helvetica, sans-serif"><title>Règle du produit : 2³ × 2⁴ s’écrit avec 3 facteurs 2 puis 4 facteurs 2, soit 7 facteurs : 2⁷ = 128 ; de même pour le quotient et la puissance de puissance</title><rect width="760" height="238" fill="white"/><text x="30" y="30" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">Pourquoi 2³ × 2⁴ = 2⁷ ? On compte les facteurs.</text><rect x="40" y="60" width="36" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="58" y="84" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold">2</text><text x="80" y="84" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">×</text><rect x="84" y="60" width="36" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="102" y="84" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold">2</text><text x="124" y="84" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">×</text><rect x="128" y="60" width="36" height="36" rx="6" fill="#dbe8f5" stroke="#1f4e79" stroke-width="1.5"/><text x="146" y="84" font-size="16" fill="#1f4e79" text-anchor="middle" font-weight="bold">2</text><text x="176" y="84" font-size="18.9" fill="#222" text-anchor="middle" font-weight="bold">×</text><rect x="194" y="60" width="36" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="212" y="84" font-size="16.8" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text><text x="234" y="84" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">×</text><rect x="238" y="60" width="36" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="256" y="84" font-size="16.8" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text><text x="278" y="84" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">×</text><rect x="282" y="60" width="36" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="300" y="84" font-size="16.8" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text><text x="322" y="84" font-size="13.7" fill="#666" text-anchor="middle" font-weight="normal">×</text><rect x="326" y="60" width="36" height="36" rx="6" fill="#fdebd0" stroke="#c0392b" stroke-width="1.5"/><text x="344" y="84" font-size="16.8" fill="#c0392b" text-anchor="middle" font-weight="bold">2</text><line x1="40" y1="108" x2="164" y2="108" stroke="#1f4e79" stroke-width="2" stroke-linecap="round"/><text x="102" y="128" font-size="13.7" fill="#1f4e79" text-anchor="middle" font-weight="bold">2³ : 3 facteurs</text><line x1="194" y1="108" x2="362" y2="108" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><text x="278" y="128" font-size="13.7" fill="#c0392b" text-anchor="middle" font-weight="bold">2⁴ : 4 facteurs</text><text x="560" y="70" font-size="15.8" fill="#222" text-anchor="start" font-weight="bold">3 + 4 = 7 facteurs</text><text x="560" y="94" font-size="16.8" fill="#2e7d32" text-anchor="start" font-weight="bold">2³ × 2⁴ = 2⁷ = 128</text><text x="30" y="172" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Quotient : 2⁵ ÷ 2² — on simplifie 2 facteurs en haut et en bas, il en reste 5 − 2 = 3 : 2⁵ ÷ 2² = 2³.</text><text x="30" y="197.2" font-size="14.7" fill="#222" text-anchor="start" font-weight="normal">Puissance de puissance : (2³)² = 2³ × 2³ = 2⁶ (2 groupes de 3 facteurs).</text><text x="30" y="222.4" font-size="14.7" fill="#c0392b" text-anchor="start" font-weight="bold">Attention : 2³ + 2⁴ = 8 + 16 = 24, ce n’est pas 2⁷. Les règles ne valent que pour × et ÷.</text></svg>